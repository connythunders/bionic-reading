<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retorikverkstaden</title>
<meta name="description" content="Interaktivt läromedel i fem steg om argumenterande text: lär dig patos, logos och etos, träna på att känna igen greppen, dra i reglage som skriver om en debattartikel, skriv en egen text med realtidsanalys och testa dina kunskaper.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  :root{
    --paper:#FAF7F2;
    --dot:#d8d0c2;
    --panel:#FFFFFF;
    --ink:#1e293b;
    --ink-strong:#0f172a;
    --muted:#64748b;
    --faint:#94a3b8;
    --line:#e2e8f0;
    --yellow:#FDE047;
    --yellow-soft:#FEF9C3;
    --yellow-pale:#FEFCE8;
    --patos:#EF4444;
    --logos:#3B82F6;
    --etos:#10B981;
    --patos-soft:#FEE2E2;
    --logos-soft:#DBEAFE;
    --etos-soft:#D1FAE5;
    --red-pale:#FEF2F2;
    --green-pale:#ECFDF5;
    --sky:#7DD3FC;
    --sky-pale:#F0F9FF;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    background-color:var(--paper);
    background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);
    background-size:20px 20px;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3{font-family:'Outfit','Plus Jakarta Sans',system-ui,sans-serif;margin:0}
  p{margin:0}
  ul,ol{margin:0}
  ::selection{background:var(--yellow);color:#000}

  .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 40px}

  .neo{border:2.5px solid #000;box-shadow:4px 4px 0 #000}
  .neo-sm{border:2px solid #000;box-shadow:2.5px 2.5px 0 #000}

  .btn{
    font:inherit;font-weight:800;font-size:14px;cursor:pointer;
    border:2px solid #000;box-shadow:3px 3px 0 #000;border-radius:8px;
    background:var(--panel);padding:10px 20px;color:var(--ink-strong);
    display:inline-flex;align-items:center;gap:8px;transition:transform .1s ease,box-shadow .1s ease;
  }
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 #000}
  .btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  .btn:disabled{opacity:.4;cursor:default}
  .btn--primary{background:var(--yellow)}
  .btn--small{padding:6px 12px;font-size:12px;box-shadow:2.5px 2.5px 0 #000}

  .hero{background:var(--yellow);border-radius:16px;padding:20px}
  .hero__row{display:flex;flex-direction:column;gap:16px}
  .chip{
    display:inline-block;background:var(--yellow-soft);border:2px solid #000;box-shadow:2.5px 2.5px 0 #000;
    border-radius:8px;padding:5px 12px;font-family:'Outfit',sans-serif;font-weight:800;
    font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  }
  .hero h1{font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:1.02;margin-top:12px}
  .hero__sub{margin-top:8px;font-size:14px;line-height:1.6;font-weight:500;color:#1f2937;max-width:62ch}

  .card{background:var(--panel);border-radius:12px;overflow:hidden}
  .card__head{background:var(--yellow);border-bottom:2.5px solid #000;padding:8px 16px}
  .card__head h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-style:italic}
  .card__body{padding:20px}

  .stack{display:flex;flex-direction:column;gap:20px}
  .stack--sm{gap:12px}

  /* Steg 1 */
  .pillars{display:grid;gap:20px}
  .pillar{background:var(--panel);border-radius:12px;padding:20px}
  .pillar__icon{
    width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    border:2px solid #000;box-shadow:2.5px 2.5px 0 #000;font-size:20px;
  }
  .pillar__kicker{margin-top:16px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
  .pillar h3{font-size:24px;font-weight:900;text-transform:uppercase;font-style:italic;letter-spacing:-.02em}
  .pillar__tag{font-family:'Outfit',sans-serif;font-weight:800;font-size:14px;color:var(--ink-strong);margin-top:2px}
  .pillar p{margin-top:8px;font-size:14px;line-height:1.6;color:#334155}

  .sub-h{font-family:'Outfit',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
  .rule{border-bottom:2px solid #000;padding-bottom:6px}

  .bullets{list-style:none;padding:0;margin-top:8px;display:flex;flex-direction:column;gap:8px}
  .bullets li{display:flex;gap:10px;font-size:14px;line-height:1.6;color:#334155}
  .bullets li::before{content:"";flex:none;width:8px;height:8px;border-radius:999px;background:var(--patos);margin-top:8px}
  .bullets--grey li::before{background:var(--faint);width:6px;height:6px;margin-top:9px}

  .quote-box{
    border-left:4px solid var(--yellow);background:var(--yellow-pale);padding:12px 16px;border-radius:0 8px 8px 0;
    font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:17px;line-height:1.6;color:var(--ink-strong);
  }
  .warn{
    display:flex;gap:12px;border:2px solid var(--yellow);background:var(--yellow-pale);
    border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.6;color:#334155;
  }
  .warn b{color:var(--ink-strong)}

  .formula{background:var(--yellow);border-radius:12px;padding:20px}
  .formula__row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
  .formula__item{background:#fff;border:2px solid #000;box-shadow:2.5px 2.5px 0 #000;border-radius:8px;padding:8px 12px;font-size:14px}
  .formula__plus{font-family:'Outfit',sans-serif;font-weight:900;font-size:20px}

  .teaser{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px;border-radius:12px}
  .teaser__label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .teaser__title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:800;display:block}

  /* Gör så här / Kom ihåg */
  .howto{position:relative}
  .howto__badge{
    position:absolute;top:-12px;left:16px;z-index:2;background:var(--patos);color:#fff;
    border:2px solid #000;box-shadow:2.5px 2.5px 0 #000;border-radius:999px;padding:4px 12px;
    font-family:'Outfit',sans-serif;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  }
  .howto__box{background:var(--red-pale);border-radius:12px;padding:28px 20px 20px}
  .howto ol{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
  .howto li{display:flex;gap:12px;font-size:14px;line-height:1.45;color:#334155}
  .howto .num{
    flex:none;width:24px;height:24px;border-radius:999px;background:var(--patos);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:2px;
  }
  .tip{background:var(--yellow-soft);border-radius:12px;padding:16px;display:flex;gap:12px}
  .tip__icon{flex:none;font-size:18px;line-height:1.2}
  .tip__title{font-family:'Outfit',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
  .tip p{margin-top:4px;font-size:14px;line-height:1.6;color:#334155}

  /* Reglage */
  .slider-row + .slider-row{margin-top:20px}
  .slider-label{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;font-weight:700;color:#1f2937}
  .slider-line{display:flex;align-items:center;gap:16px}
  .slider-val{flex:none;width:36px;text-align:right;font-size:14px;font-weight:700;color:var(--muted)}

  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;width:100%;height:22px}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px}
  input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:transparent}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;height:22px;width:22px;margin-top:-7px;border-radius:50%;
    background:var(--patos);border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:grab;transition:transform .1s ease;
  }
  input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.15)}
  input[type=range]::-moz-range-thumb{
    height:22px;width:22px;border-radius:50%;background:var(--patos);
    border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:grab;
  }
  #s-logos::-webkit-slider-thumb{background:var(--logos)}
  #s-logos::-moz-range-thumb{background:var(--logos)}
  #s-etos::-webkit-slider-thumb{background:var(--etos)}
  #s-etos::-moz-range-thumb{background:var(--etos)}

  .article h3{font-size:20px;font-weight:800}
  .article p{margin-top:12px;font-size:14px;line-height:1.8;color:#334155}
  .hl{border-radius:4px;padding:2px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .hl--patos{background:rgba(239,68,68,.13)}
  .hl--logos{background:rgba(59,130,246,.13)}
  .hl--etos{background:rgba(16,185,129,.15)}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:999px;display:block}
  .fade{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Övning och test */
  .score{
    display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid #000;
    box-shadow:2.5px 2.5px 0 #000;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:800;
  }
  .score__num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .counter-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .dashes{display:flex;align-items:center;gap:6px}
  .dash{height:6px;width:8px;border-radius:999px;background:var(--line);transition:width .2s ease}
  .dash.done{background:var(--ink-strong)}
  .dash.now{width:24px;background:var(--ink-strong)}

  .alts{display:grid;gap:16px;margin-top:20px}
  .alt{
    background:#fff;border-radius:12px;padding:20px 16px;cursor:pointer;font:inherit;
    display:flex;flex-direction:column;align-items:center;gap:12px;transition:background .15s ease;
  }
  .alt:hover:not(:disabled){background:var(--yellow-pale)}
  .alt:disabled{cursor:default}
  .alt__icon{
    width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    border:2px solid #000;box-shadow:2.5px 2.5px 0 #000;font-size:20px;
  }
  .alt__label{font-size:14px;font-weight:800;color:var(--ink-strong)}
  .alt.correct{background:var(--etos-soft)}
  .alt.wrong{background:var(--patos-soft)}
  .alt.dim{opacity:.5}

  .opts{display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .opt{
    width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;cursor:pointer;
    background:#fff;border-radius:12px;padding:12px 16px;transition:background .15s ease;
  }
  .opt:hover:not(:disabled){background:var(--yellow-pale)}
  .opt:disabled{cursor:default}
  .opt__letter{
    flex:none;width:28px;height:28px;border-radius:8px;background:#fff;border:2px solid #000;box-shadow:2.5px 2.5px 0 #000;
    display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:12px;font-weight:800;
  }
  .opt__text{font-size:14px;font-weight:600;color:#1f2937}
  .opt__mark{margin-left:auto;font-weight:800}
  .opt.correct{background:var(--etos-soft)}
  .opt.wrong{background:var(--patos-soft)}
  .opt.dim{opacity:.5}

  .feedback{margin-top:20px;border-radius:12px;border:2px solid;padding:16px;display:flex;gap:12px}
  .feedback.right{border-color:var(--etos);background:var(--green-pale)}
  .feedback.wrong{border-color:var(--patos);background:var(--red-pale)}
  .feedback__icon{
    flex:none;width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    border:2px solid #000;box-shadow:2.5px 2.5px 0 #000;font-weight:800;font-size:14px;
  }
  .feedback.right .feedback__icon{background:var(--etos)}
  .feedback.wrong .feedback__icon{background:var(--patos);color:#fff}
  .feedback__title{font-family:'Outfit',sans-serif;font-size:14px;font-weight:800}
  .feedback p{margin-top:4px;font-size:14px;line-height:1.6;color:#334155}
  .feedback--flat{display:block}
  .feedback--flat p{margin-top:0}
  .right-align{display:flex;justify-content:flex-end;margin-top:16px}

  .result{text-align:center;padding:8px 0}
  .result__label{font-family:'Outfit',sans-serif;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .result__score{font-family:'Outfit',sans-serif;font-size:40px;font-weight:900;margin-top:8px}
  .result__score span{color:var(--faint)}
  .result p{margin-top:8px;font-size:14px;line-height:1.6;color:#334155}

  /* Steg 4 */
  .field{
    width:100%;font:inherit;font-weight:700;border:2px solid #cbd5e1;background:#f8fafc;
    border-radius:12px;padding:12px 16px;color:var(--ink-strong);margin-top:8px;
  }
  .field:focus{outline:none;border-color:#000}
  .field::placeholder{font-weight:500;color:var(--faint)}
  .suggestions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .suggestions b{font-size:12px;font-weight:800;color:#334155}
  .sugg{
    font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:#334155;
    border:2px solid #cbd5e1;background:#f8fafc;border-radius:8px;padding:6px 12px;
    max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color .15s ease,background .15s ease;
  }
  .sugg:hover{border-color:#000;background:var(--yellow-soft)}

  .editor__head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2.5px solid #000;padding:10px 16px}
  .editor__title{display:flex;align-items:center;gap:8px}
  .editor__count{font-size:12px;font-weight:600;color:var(--muted)}
  .editor__count b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#334155}
  #draft{
    width:100%;min-height:240px;resize:vertical;border:0;background:#fff;padding:20px;
    font:inherit;font-size:16px;line-height:1.7;color:#1f2937;display:block;
  }
  #draft:focus{outline:none}
  #draft::placeholder{color:var(--faint)}
  .editor__foot{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
    border-top:2.5px solid #000;background:#f8fafc;padding:10px 16px;
  }
  .editor__hint{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#475569}

  .live{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .live__badge{background:var(--yellow);border:2px solid #000;box-shadow:2.5px 2.5px 0 #000;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
  .meter + .meter{margin-top:16px}
  .meter__top{display:flex;align-items:center;gap:8px}
  .meter__label{font-size:14px;font-weight:700;color:#1f2937}
  .meter__pct{margin-left:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700;color:var(--muted)}
  .track{display:block;height:12px;width:100%;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:6px}
  .track>span{display:block;height:100%;border-radius:999px;transition:width .3s ease}
  .evidence{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .evidence code{background:#f1f5f9;color:#475569;border-radius:6px;padding:2px 6px;font-family:inherit;font-weight:500}

  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .pill{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--faint)}
  .pill.on{border-color:var(--etos);background:var(--green-pale);color:#047857}

  .coach{margin-top:20px;border:2px solid var(--yellow);background:var(--yellow-pale);border-radius:12px;padding:16px}
  .coach__title{display:flex;align-items:center;gap:8px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:800}
  .coach__lean{margin-top:8px;font-size:14px;line-height:1.6;color:#334155}

  .checklist{border:2px solid var(--sky);background:var(--sky-pale);border-radius:12px;padding:20px}
  .checklist h2{font-family:'Outfit',sans-serif;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
  .check{display:flex;align-items:flex-start;gap:12px;cursor:pointer;margin-top:10px}
  .check input{position:absolute;opacity:0;width:0;height:0}
  .check__box{
    flex:none;width:20px;height:20px;margin-top:2px;border-radius:6px;background:#fff;
    border:2px solid #000;box-shadow:2.5px 2.5px 0 #000;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;line-height:1;
  }
  .check input:checked + .check__box{background:#34D399}
  .check__text{font-size:14px;line-height:1.45;color:#334155}
  .check input:checked ~ .check__text{color:var(--faint);text-decoration:line-through}
  .check input:focus-visible + .check__box{outline:2px solid #000;outline-offset:2px}

  /* Lathund */
  .guide__head{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
    background:var(--yellow);border-bottom:2.5px solid #000;padding:12px 20px;
  }
  .guide__head h2{font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  .guide__section + .guide__section{margin-top:24px}
  .guide__list{list-style:none;padding:0;margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .guide__list li{display:flex;gap:12px;font-size:14px;line-height:1.6;color:#334155}
  .guide__list b{color:var(--ink-strong)}
  .guide__num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);flex:none}
  .guide__dot{flex:none}

  /* Navigering */
  .nav{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:32px}
  .nav__center{display:flex;flex-direction:column;align-items:center}
  .dots{display:flex;align-items:center;gap:8px}
  .dot-btn{background:none;border:0;padding:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:999px}
  .dot-btn:hover .dot{transform:scale(1.25)}
  .dot{width:8px;height:8px;border-radius:999px;background:#cbd5e1;transition:transform .15s ease}
  .dot.done{background:var(--ink-strong)}
  .dot.now{width:12px;height:12px;background:var(--patos)}
  .nav__label{font-size:12px;font-weight:600;color:var(--muted);margin-top:6px}

  .icon{font-size:16px;line-height:1}

  @media (min-width:640px){
    .wrap{padding:32px 24px 48px}
    .hero{padding:28px}
    .hero h1{font-size:38px}
    .hero__row{flex-direction:row;align-items:flex-start;justify-content:space-between}
    .pillars{grid-template-columns:repeat(3,1fr)}
    .alts{grid-template-columns:repeat(3,1fr)}
    .nav{flex-direction:row;justify-content:space-between}
    .nav__prev{order:1}
    .nav__center{order:2}
    .nav__next{order:3}
  }
  @media (min-width:900px){
    .hero h1{font-size:46px}
    .two-col{display:grid;grid-template-columns:5fr 7fr;gap:24px;align-items:start}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  }
</style>
</head>
<body>
<div class="wrap">
  <main id="app"></main>

  <nav class="nav" aria-label="Stegnavigering">
    <button class="btn nav__prev" id="prevBtn">← Föregående</button>
    <div class="nav__center">
      <div class="dots" id="dots"></div>
      <p class="nav__label" id="navLabel"></p>
    </div>
    <button class="btn btn--primary nav__next" id="nextBtn"></button>
  </nav>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     Data
     ============================================================ */

  var STEPS = [
    { n: 1, short: 'Grunderna' },

  function reviveQuiz(stored, length) {
    if (!stored || typeof stored !== 'object') return null;
    if (!Array.isArray(stored.answers) || stored.answers.length !== length) return null;
    var i = stored.index;
    if (typeof i !== 'number' || i % 1 !== 0 || i < 0 || i > length) return null;
    return { index: i, answers: stored.answers.map(function (a) { return typeof a === 'number' ? a : null; }) };
  }

  function load() {
    var state = defaults();
    var raw;
    try { raw = window.localStorage.getItem(KEY); } catch (err) { return state; }
    if (!raw) return state;

    var saved;
    try { saved = JSON.parse(raw); } catch (err) { return state; }
    if (!saved || typeof saved !== 'object') return state;

    if (typeof saved.step === 'number' && saved.step >= 1 && saved.step <= LAST) state.step = saved.step;
    if (saved.values && typeof saved.values === 'object') {
      var ok = APPEALS.every(function (k) {
        return typeof saved.values[k] === 'number' && saved.values[k] >= 0 && saved.values[k] <= 100;
      });
      if (ok) state.values = { patos: saved.values.patos, logos: saved.values.logos, etos: saved.values.etos };
    }
    if (typeof saved.thesis === 'string') state.thesis = saved.thesis;
    if (typeof saved.draft === 'string') state.draft = saved.draft;
    if (saved.checks && typeof saved.checks === 'object' && !Array.isArray(saved.checks)) {
      Object.keys(saved.checks).forEach(function (k) {
        if (typeof saved.checks[k] === 'boolean') state.checks[k] = saved.checks[k];
      });
    }
    state.quiz2 = reviveQuiz(saved.quiz2, RECOGNITION.length) || state.quiz2;
    state.quiz5 = reviveQuiz(saved.quiz5, KNOWLEDGE.length) || state.quiz5;
    return state;
  }

  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (err) { /* privat läge */ }
  }

  var state = load();

  /* ============================================================
     Hjälpare
     ============================================================ */

  var app = document.getElementById('app');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var dotsEl = document.getElementById('dots');
  var navLabel = document.getElementById('navLabel');

  var ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (c) { return ESCAPES[c]; });
  }

  function hero(kicker, title, sub, aside) {
    return '<header class="hero neo">' +
      '<div class="hero__row"><div style="min-width:0">' +
      '<span class="chip">' + esc(kicker) + '</span>' +
      '<h1>' + esc(title) + '</h1>' +
      (sub ? '<p class="hero__sub">' + esc(sub) + '</p>' : '') +
      '</div>' + (aside ? '<div style="flex:none">' + aside + '</div>' : '') +
      '</div></header>';
  }

  function card(title, body, bodyStyle) {
    return '<section class="card neo">' +
      '<div class="card__head"><h2>' + esc(title) + '</h2></div>' +
      '<div class="card__body"' + (bodyStyle ? ' style="' + bodyStyle + '"' : '') + '>' + body + '</div>' +
      '</section>';
  }

  function trackFill(key, value) {
    return 'linear-gradient(to right, ' + APPEAL[key].color + ' ' + value + '%, #E2E8F0 ' + value + '%)';
  }

  function countCorrect(quiz, correct) {
    return quiz.answers.filter(function (a, i) { return a !== null && a === correct[i]; }).length;
  }

  /* ============================================================
     Steg 1 – Grunderna
     ============================================================ */

        '<h3>' + esc(a.label) + '</h3>' +

        '<p>' + esc(p.body) + '</p>' +
        '</div>';
    }).join('');

    var devices = DEVICES.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('');

    var deep =
      '<h3 style="font-size:20px;font-weight:800">Hur du berör mottagaren på djupet</h3>' +
      '<div class="split" style="margin-top:16px">' +

          '</div>' +
          '<div class="warn"><span class="icon">⚠️</span><p><b>Varning vid för mycket Patos:</b> Texten kan upplevas som manipulerande eller ”känslotjafs” om du inte har fakta (Logos) som stöder dina påståenden.</p></div>' +
        '</div>' +
      '</div>';

    var formula = FORMULA.map(function (f, i) {
      return (i > 0 ? '<span class="formula__plus">+</span>' : '') +
        '<span class="formula__item"><b style="font-family:Outfit,sans-serif;color:' + f.color + '">' + esc(f.name) + '</b> ' + esc(f.verb) + '</span>';
    }).join('');

    app.innerHTML =
      '<div class="stack">' +
        hero('Steg 1 av 5 · Grunderna', 'Retorikens tre grundpelare',
          'Redan i det antika Grekland formulerade filosofen Aristoteles de tre sätt en talare eller skribent kan övertyga sin publik på: genom att beröra hjärtat (Patos), övertyga hjärnan (Logos) eller vinna förtroendet (Etos).') +
        '<div class="pillars">' + pillars + '</div>' +
        card('Fördjupning: Patos – Väcka känslor', deep, 'padding:24px') +
        '<div class="formula neo"><p class="sub-h">Aristoteles gyllene formel:</p><div class="formula__row">' + formula + '<span class="formula__plus">!</span></div></div>' +
        '<button class="btn teaser" id="teaser"><span><span class="teaser__label">Nästa</span><span class="teaser__title">' + esc(STEPS[1].short) + '</span></span><span class="icon">→</span></button>' +
      '</div>';

    document.getElementById('teaser').addEventListener('click', function () { goTo(2); });
  }

  /* ============================================================
     Steg 2 – Känn igen greppen
     ============================================================ */

  function renderStep2() {
    var quiz = state.quiz2;
    var total = RECOGNITION.length;
    var score = countCorrect(quiz, RECOGNITION_CORRECT);
    var done = quiz.index >= total;
    var pos = Math.min(quiz.index, total - 1);
    var question = RECOGNITION[pos];
    var correct = RECOGNITION_CORRECT[pos];
    var given = done ? null : quiz.answers[quiz.index];
    var answered = given !== null && given !== undefined;

    var aside = '<span class="score"><span class="icon">🎖️</span>Poäng: <span class="score__num">' + score + ' / ' + total + '</span></span>';

    var dashes = RECOGNITION.map(function (_, i) {
      var cls = i === quiz.index ? 'dash now' : (quiz.answers[i] !== null ? 'dash done' : 'dash');
      return '<span class="' + cls + '"></span>';
    }).join('');

    var body;
    if (done) {
      body =
        '<div class="result">' +
          '<p class="result__label">Ditt resultat</p>' +
          '<p class="result__score">' + score + ' <span>av ' + total + '</span></p>' +
          '<p>' + (score === total
            ? 'Alla rätt! Du ser skillnad på greppen även när de är förklädda.'
            : score >= total / 2
              ? 'Bra jobbat. Läs gärna förklaringarna en gång till och kör om övningen.'
              : 'Greppen liknar varandra i början. Gå tillbaka till steg 1 och kör sedan om övningen.') + '</p>' +
        '</div>';
    } else {
      var alts = ALTERNATIVES.map(function (alt, i) {
        var a = APPEAL[alt.key];
        var cls = 'alt neo';
        if (answered) {
          if (i === correct) cls += ' correct';
          else if (i === given) cls += ' wrong';
          else cls += ' dim';
        }
        return '<button class="' + cls + '" data-choice="' + i + '"' + (answered ? ' disabled' : '') + '>' +
          '<span class="alt__icon" style="background:' + a.soft + '">' + a.icon + '</span>' +
          '<span class="alt__label">' + esc(alt.label) + '</span>' +
          '</button>';
      }).join('');

      var feedback = '';
      if (answered) {
        var right = given === correct;
        feedback =
          '<div class="feedback ' + (right ? 'right' : 'wrong') + ' fade">' +
            '<span class="feedback__icon">' + (right ? '✓' : '✕') + '</span>' +
            '<div><p class="feedback__title">' + (right ? 'Rätt!' : 'Inte riktigt – rätt svar är ' + esc(ALTERNATIVES[correct].label) + '.') + '</p>' +
            '<p>' + esc(question.why) + '</p></div>' +
          '</div>' +
          '<div class="right-align"><button class="btn btn--primary" id="nextQ">' +
            (quiz.index + 1 === total ? 'Se resultat →' : 'Nästa fråga →') + '</button></div>';
      }

      body =
        '<span class="chip" style="background:#fff">' + esc(question.source) + '</span>' +
        '<blockquote class="quote-box" style="margin-top:16px">”' + esc(question.quote) + '”</blockquote>' +
        '<div class="alts">' + alts + '</div>' + feedback;
    }

    app.innerHTML =
      '<div class="stack">' +
        hero('Steg 2 av 5 · Interaktiv träning', 'Känn igen retorikgreppen', 'Läs citatet nedan. Vilket av de tre greppen dominerar?', aside) +
        '<div class="counter-row"><p class="sub-h">' + (done ? 'Klart!' : 'Fråga ' + (quiz.index + 1) + ' av ' + total) + '</p>' +
        '<div class="dashes">' + dashes + '</div></div>' +
        '<section class="card neo fade" style="border-radius:16px"><div class="card__body" style="padding:24px">' + body + '</div></section>' +
        '<div><button class="btn" id="restart2"><span class="icon">↺</span>Börja om övningen</button></div>' +
      '</div>';

    Array.prototype.forEach.call(app.querySelectorAll('[data-choice]'), function (btn) {
      btn.addEventListener('click', function () {
        if (answered) return;
        quiz.answers[quiz.index] = Number(btn.getAttribute('data-choice'));
        save();
        renderStep2();
      });
    });
    var nextQ = document.getElementById('nextQ');
    if (nextQ) nextQ.addEventListener('click', function () { quiz.index += 1; save(); renderStep2(); });
    document.getElementById('restart2').addEventListener('click', function () {
      state.quiz2 = emptyQuiz(RECOGNITION.length); save(); renderStep2();
    });
  }

  /* ============================================================
     Steg 3 – Testa själv
     ============================================================ */

  function articleHTML() {
    var v = state.values;
    var title = TITLES[dominantAppeal(v)];
    var parts = [
      { key: 'patos', text: PARAGRAPHS.patos[levelOf(v.patos)] },
      { key: 'logos', text: PARAGRAPHS.logos[levelOf(v.logos)] },
      { key: 'etos', text: PARAGRAPHS.etos[levelOf(v.etos)] }
    ];
    return '<h3>' + esc(title) + '</h3>' +
      parts.map(function (p) {
        return '<p><span class="hl hl--' + p.key + '">' + esc(p.text) + '</span></p>';
      }).join('') +
      '<div class="legend">' + APPEALS.map(function (k) {
        return '<span><i style="background:' + APPEAL[k].color + '"></i>' + APPEAL[k].label + '</span>';
      }).join('') + '</div>';
  }

  function renderStep3() {
    var labels = {
      patos: 'Patos – väcka känslor',
      logos: 'Logos – använda fakta och logik',
      etos: 'Etos – bygga trovärdighet'
    };

    var sliders = APPEALS.map(function (key) {
      var value = state.values[key];
      return '<div class="slider-row">' +
        '<div class="slider-label"><span class="icon">' + APPEAL[key].icon + '</span><label for="s-' + key + '">' + esc(labels[key]) + '</label></div>' +
        '<div class="slider-line">' +
          '<input type="range" id="s-' + key + '" min="0" max="100" value="' + value + '" style="background:' + trackFill(key, value) + '">' +
          '<output class="slider-val" id="v-' + key + '">' + value + '</output>' +
        '</div></div>';
    }).join('');

    var left =
      '<div class="howto"><span class="howto__badge">Gör så här:</span><div class="howto__box neo"><ol>' +
        '<li><span class="num">1</span><span>Dra i reglagen för att justera patos, logos och etos.</span></li>' +
        '<li><span class="num">2</span><span>Läs hur texten förändras i rutan till höger.</span></li>' +
        '<li><span class="num">3</span><span>Fundera på: Vilken version tycker du är mest övertygande – och varför?</span></li>' +
      '</ol></div></div>' +
      '<div class="tip neo"><span class="tip__icon">💡</span><div><p class="tip__title">Kom ihåg:</p>' +
      '<p>Det finns sällan ett ”rätt” svar. Olika situationer kräver olika balans mellan patos, logos och etos.</p></div></div>';

    var right =
      card('Justera de retoriska greppen', sliders) +
      card('Texten förändras så här', '<div class="article" id="article">' + articleHTML() + '</div>', 'padding:24px');

    app.innerHTML =
      '<div class="stack">' +
        hero('Steg 3 av 5 · Retoriska reglage', 'Testa själv: Hur förändras texten?',
          'I en debattartikel använder man ofta retoriska grepp som patos, logos och etos. Här kan du justera balansen mellan dem och se hur språket, ordvalen och tonen förändras.') +
        '<div class="two-col"><div class="stack">' + left + '</div><div class="stack">' + right + '</div></div>' +
      '</div>';

    APPEALS.forEach(function (key) {
      var input = document.getElementById('s-' + key);
      input.addEventListener('input', function () {
        var value = Number(input.value);
        state.values[key] = value;
        document.getElementById('v-' + key).textContent = value;
        input.style.background = trackFill(key, value);
        var article = document.getElementById('article');
        article.innerHTML = articleHTML();
        article.classList.remove('fade');
        void article.offsetWidth;
        article.classList.add('fade');
        save();
      });
    });
  }

  /* ============================================================
     Steg 4 – Skriv uppgift
     ============================================================ */

  function analysisHTML(a) {
    var meters = METERS.map(function (m) {
      var value = a.scores[m.key];
      var ev = a.evidence[m.key];
      return '<div class="meter">' +
        '<div class="meter__top"><span class="icon">' + APPEAL[m.key].icon + '</span>' +
        '<span class="meter__label">' + esc(m.label) + '</span>' +
        '<span class="meter__pct">' + value + '%</span></div>' +
        '<span class="track"><span style="width:' + value + '%;background:' + APPEAL[m.key].color + '"></span></span>' +
        (ev.length ? '<p class="evidence"><span>Reagerade på:</span>' +
          ev.map(function (t) { return '<code>' + esc(t) + '</code>'; }).join('') + '</p>' : '') +
        '</div>';
    }).join('');

    var pills = a.words > 0
      ? '<div class="pills">' +
          '<span class="pill' + (a.hasCallToAction ? ' on' : '') + '">' + (a.hasCallToAction ? '✓' : '–') + ' Uppmaning</span>' +
          '<span class="pill' + (a.hasCounterArgument ? ' on' : '') + '">' + (a.hasCounterArgument ? '✓' : '–') + ' Motargument</span>' +
        '</div>'
      : '';

    var tips = coachingTips(a).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');

    return '<div class="live"><h2 class="sub-h">Realtidsanalys av din text</h2><span class="live__badge">Live</span></div>' +
      '<div style="margin-top:16px">' + meters + '</div>' + pills +
      '<div class="coach"><p class="coach__title"><span class="icon">💡</span>Coachande råd till din text:</p>' +
      (a.dominant ? '<p class="coach__lean">Din text lutar mest åt <b>' + esc(a.dominant) + '</b>.</p>' : '') +
      '<ul class="bullets bullets--grey" style="margin-top:8px">' + tips + '</ul></div>';
  }

  function renderStep4() {
    var suggestions = SUGGESTIONS.map(function (s) {
      return '<button class="sugg" data-sugg="' + esc(s) + '" title="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('');

    var checks = WRITING_CHECKS.map(function (c) {
      var on = state.checks[c.id] === true;
      return '<label class="check"><input type="checkbox" data-check="' + c.id + '"' + (on ? ' checked' : '') + '>' +
        '<span class="check__box">' + (on ? '✓' : '') + '</span>' +
        '<span class="check__text">' + esc(c.text) + '</span></label>';
    }).join('');

    app.innerHTML =
      '<div class="stack">' +
        hero('Steg 4 av 5 · Egen text', 'Skrivuppgift: Bygg din egen text',
          'Skriv ett kort inlägg eller stycke till en debattartikel. Se i realtid hur din text använder patos, logos och etos!') +

        '<section class="card neo" style="border-radius:16px"><div class="card__body">' +
          '<label class="sub-h" for="thesis">Din tes / ämne:</label>' +
          '<input class="field" id="thesis" type="text" placeholder="T.ex. Vi måste rädda skolgårdarna från att byggas bort">' +
          '<div class="suggestions"><b>Förslag:</b>' + suggestions + '</div>' +
        '</div></section>' +

        '<section class="card neo" style="border-radius:16px">' +
          '<div class="editor__head">' +
            '<div class="editor__title"><span class="icon">✒️</span><h2 class="sub-h">Ditt debattinlägg</h2></div>' +
            '<p class="editor__count" id="counts"></p>' +
          '</div>' +
          '<textarea id="draft" placeholder="Skriv ditt inlägg här …"></textarea>' +
          '<div class="editor__foot">' +
            '<p class="editor__hint"><span class="icon">💡</span>Tips: Försök få med minst ett argument från varje grepp.</p>' +
            '<button class="btn btn--small" id="copyDraft"><span class="icon">⧉</span>Kopiera</button>' +
          '</div>' +
        '</section>' +

        '<section class="card neo" style="border-radius:16px"><div class="card__body" id="analysis" style="padding:24px"></div></section>' +

        '<section class="checklist"><h2>Retorik-checklista för debattartiklar:</h2>' + checks + '</section>' +
      '</div>';

    var thesis = document.getElementById('thesis');
    thesis.value = state.thesis;

    var draft = document.getElementById('draft');
    draft.value = state.draft;

    var counts = document.getElementById('counts');
    var analysisBox = document.getElementById('analysis');

    function refresh() {
      var a = analyze(state.draft);
      analysisBox.innerHTML = analysisHTML(a);
      counts.innerHTML = '<b>' + a.words + '</b> ord · <b>' + a.sentences + '</b> ' +
        (a.sentences === 1 ? 'mening' : 'meningar');
    }
    refresh();

    draft.addEventListener('input', function () { state.draft = draft.value; save(); refresh(); });
    thesis.addEventListener('input', function () { state.thesis = thesis.value; save(); });

    Array.prototype.forEach.call(app.querySelectorAll('[data-sugg]'), function (btn) {
      btn.addEventListener('click', function () {
        state.thesis = btn.getAttribute('data-sugg');
        thesis.value = state.thesis;
        save();
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll('[data-check]'), function (box) {
      box.addEventListener('change', function () {
        state.checks[box.getAttribute('data-check')] = box.checked;
        box.nextElementSibling.textContent = box.checked ? '✓' : '';
        save();
      });
    });

    var copyBtn = document.getElementById('copyDraft');
    copyBtn.addEventListener('click', function () { copyText(state.draft, copyBtn, 'Kopiera'); });
  }

  function copyText(text, button, resetLabel) {
    if (!text.trim()) return;
    if (!navigator.clipboard || !navigator.clipboard.writeText) return;
    navigator.clipboard.writeText(text).then(function () {
      button.innerHTML = '<span class="icon">✓</span>Kopierat!';
      window.setTimeout(function () {
        button.innerHTML = '<span class="icon">⧉</span>' + resetLabel;
      }, 1600);
    }, function () { /* nekad behörighet – knappen står kvar oförändrad */ });
  }

  /* ============================================================
     Steg 5 – Kunskapstest och lathund
     ============================================================ */

  function renderStep5() {
    var quiz = state.quiz5;
    var total = KNOWLEDGE.length;
    var score = countCorrect(quiz, KNOWLEDGE_CORRECT);
    var done = quiz.index >= total;
    var pos = Math.min(quiz.index, total - 1);
    var question = KNOWLEDGE[pos];
    var given = done ? null : quiz.answers[quiz.index];
    var answered = given !== null && given !== undefined;
    var letters = ['A', 'B', 'C', 'D'];

    var testBody;
    if (done) {
      testBody =
        '<div class="result">' +
          '<p class="result__score">' + score + ' <span>av ' + total + '</span></p>' +
          '<p>' + (score === total
            ? 'Fullpott! Du har greppen i ryggmärgen – spara lathunden och använd den när du skriver.'
            : score >= 3
              ? 'Bra jobbat! Läs igenom lathunden nedan så sitter resten.'
              : 'Gå tillbaka till steg 1 och 2, och gör sedan om testet. Lathunden nedan är en bra genväg.') + '</p>' +
          '<button class="btn" id="restart5" style="margin-top:20px"><span class="icon">↺</span>Gör om testet</button>' +
        '</div>';
    } else {
      var opts = question.options.map(function (option, i) {
        var cls = 'opt neo';
        var mark = '';
        if (answered) {
          if (i === question.correct) { cls += ' correct'; mark = '<span class="opt__mark">✓</span>'; }
          else if (i === given) { cls += ' wrong'; mark = '<span class="opt__mark">✕</span>'; }
          else cls += ' dim';
        }
        return '<button class="' + cls + '" data-opt="' + i + '"' + (answered ? ' disabled' : '') + '>' +
          '<span class="opt__letter">' + letters[i] + '</span>' +
          '<span class="opt__text">' + esc(option) + '</span>' + mark +
          '</button>';
      }).join('');

      var feedback = '';
      if (answered) {
        var right = given === question.correct;
        feedback =
          '<div class="feedback feedback--flat ' + (right ? 'right' : 'wrong') + ' fade">' +
            '<p><b class="feedback__title">' + (right ? 'Rätt! ' : 'Inte riktigt. ') + '</b>' + esc(question.why) + '</p>' +
          '</div>' +
          '<div class="right-align"><button class="btn btn--primary" id="nextK">' +
            (quiz.index + 1 === total ? 'Se resultat →' : 'Nästa fråga →') + '</button></div>';
      }

      testBody = '<h2 style="font-size:18px;font-weight:800;margin-top:16px">' + esc(question.q) + '</h2>' +
        '<div class="opts">' + opts + '</div>' + feedback;
    }

    var guidePillars = GUIDE_PILLARS.map(function (p) {
      return '<li><span class="guide__dot icon">' + APPEAL[p.key].icon + '</span>' +
        '<span><b>' + esc(p.name) + ' (' + esc(p.nick) + '):</b> ' + esc(p.text) + '</span></li>';
    }).join('');

    var guideStructure = GUIDE_STRUCTURE.map(function (s, i) {
      return '<li><span class="guide__num">' + (i + 1) + '.</span><span><b>' + esc(s.label) + ':</b> ' + esc(s.text) + '</span></li>';
    }).join('');

    var guideWords = GUIDE_CONNECTIVES.map(function (c) {
      return '<li><span><b><i>' + esc(c.label) + ':</i></b> ' + esc(c.words) + '</span></li>';
    }).join('');

    app.innerHTML =
      '<div class="stack">' +
        hero('Steg 5 av 5 · Kunskapstest & lathund', 'Testa dina kunskaper & ladda ner lathunden',
          'Svara på de 5 frågorna för att se hur väl du behärskar patos, logos och etos, och spara sedan lathunden inför dina kommande skrivuppgifter!') +

        '<section class="card neo" style="border-radius:16px"><div class="card__body" style="padding:24px">' +
          '<div class="counter-row" style="border-bottom:1px solid var(--line);padding-bottom:16px">' +
            '<p class="sub-h">' + (done ? 'Klart!' : 'Fråga ' + (quiz.index + 1) + ' av ' + total) + '</p>' +
            '<span class="score" style="border-color:var(--yellow);box-shadow:none;border-radius:999px;padding:6px 12px">' +
              '<span class="icon">🎖️</span>' + score + ' / ' + total + ' rätt</span>' +
          '</div>' + testBody +
        '</div></section>' +

        '<section class="card neo" style="border-radius:16px">' +
          '<div class="guide__head"><h2><span class="icon">📖</span>Retorikens lathund</h2>' +
            '<div style="display:flex;gap:8px">' +
              '<button class="btn btn--small" id="copyGuide"><span class="icon">⧉</span>Kopiera</button>' +
              '<button class="btn btn--small" id="dlGuide"><span class="icon">⤓</span>Ladda ner</button>' +
            '</div>' +
          '</div>' +
          '<div class="card__body" style="padding:24px">' +
            '<div class="guide__section"><h3 class="sub-h rule">1. De tre pelarna i korthet:</h3><ul class="guide__list">' + guidePillars + '</ul></div>' +
            '<div class="guide__section"><h3 class="sub-h rule">2. Debattartikelns struktur:</h3><ol class="guide__list">' + guideStructure + '</ol></div>' +
            '<div class="guide__section"><h3 class="sub-h rule">3. Smarta sambandsord:</h3><ul class="guide__list">' + guideWords + '</ul></div>' +
          '</div>' +
        '</section>' +
      '</div>';

    Array.prototype.forEach.call(app.querySelectorAll('[data-opt]'), function (btn) {
      btn.addEventListener('click', function () {
        if (answered) return;
        quiz.answers[quiz.index] = Number(btn.getAttribute('data-opt'));
        save();
        renderStep5();
      });
    });
    var nextK = document.getElementById('nextK');
    if (nextK) nextK.addEventListener('click', function () { quiz.index += 1; save(); renderStep5(); });
    var restart5 = document.getElementById('restart5');
    if (restart5) restart5.addEventListener('click', function () {
      state.quiz5 = emptyQuiz(KNOWLEDGE.length); save(); renderStep5();
    });

    var copyGuide = document.getElementById('copyGuide');
    copyGuide.addEventListener('click', function () { copyText(guideAsText(), copyGuide, 'Kopiera'); });

    document.getElementById('dlGuide').addEventListener('click', function () {
      var blob = new Blob([guideAsText()], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = 'retorikens-lathund.txt';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });
  }

  /* ============================================================
     Navigering
     ============================================================ */

  var RENDERERS = { 1: renderStep1, 2: renderStep2, 3: renderStep3, 4: renderStep4, 5: renderStep5 };

  function renderNav() {
    prevBtn.disabled = state.step === 1;
    nextBtn.textContent = state.step >= LAST ? 'Börja om från början ↺' : 'Nästa: ' + STEPS[state.step].short + ' →';
    navLabel.textContent = 'Steg ' + state.step + ' av ' + LAST;
    dotsEl.innerHTML = STEPS.map(function (s) {
      var cls = s.n === state.step ? 'dot now' : (s.n < state.step ? 'dot done' : 'dot');
      return '<button class="dot-btn" data-step="' + s.n + '" aria-label="Gå till steg ' + s.n + ': ' + esc(s.short) + '"' +
        (s.n === state.step ? ' aria-current="step"' : '') + '><span class="' + cls + '"></span></button>';
    }).join('');
    Array.prototype.forEach.call(dotsEl.querySelectorAll('[data-step]'), function (btn) {
      btn.addEventListener('click', function () { goTo(Number(btn.getAttribute('data-step'))); });
    });
  }

  function render() {
    RENDERERS[state.step]();
    renderNav();
  }

  function goTo(next) {
    var clamped = Math.min(LAST, Math.max(1, next));
    if (clamped === state.step) return;
    state.step = clamped;
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  prevBtn.addEventListener('click', function () { goTo(state.step - 1); });
  nextBtn.addEventListener('click', function () { goTo(state.step >= LAST ? 1 : state.step + 1); });

  render();
})();
</script>
</body>
</html>
