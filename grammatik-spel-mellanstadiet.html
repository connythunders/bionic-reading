<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Grammatikrallyt för åk 4–6: ett spel där eleverna tränar ordklasser, böjning, huvudsats och bisats, stavning, skiljetecken, formellt och vardagligt språk samt språken i Sverige.">
<title>Grammatikrallyt – åk 4–6</title>
<style>
:root{
  --bg:#fff7ec; --surface:#ffffff; --surface-2:#fbf1e2;
  --text:#2a2118; --soft:#6a5b4c; --line:#e6d6bf;
  --accent:#b4440f; --accent-weak:#fde9d8;
  --good:#1f7a43; --good-weak:#e2f4e8; --bad:#b3261e; --bad-weak:#fde8e6;
  --gold:#f5b400; --shadow:0 2px 4px rgba(60,30,0,.08),0 10px 30px rgba(60,30,0,.10);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1d1812; --surface:#2a231a; --surface-2:#352c20;
    --text:#f5ece0; --soft:#c9b9a3; --line:#4a3d2c;
    --accent:#ff9a62; --accent-weak:#3d2a1b;
    --good:#7fd29b; --good-weak:#1b3326; --bad:#f19a94; --bad-weak:#3a2220;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.55 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 16px}
header.top h1{font-size:1.5rem;margin:0;margin-right:auto}
.pill{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
@media (prefers-color-scheme: dark){.btn{color:#1d1812}}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--text);border:2px solid var(--line);box-shadow:none}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.world{margin-top:18px}
.world h3{margin:0 0 8px;padding-left:10px;border-left:8px solid var(--c)}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lvl{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:transform .15s}
.lvl:hover{transform:translateY(-3px);border-color:var(--c)}
.lvl .ico{font-size:2.2rem}.lvl h4{margin:.2rem 0;font-size:1.1rem}.lvl p{margin:0;color:var(--soft);font-size:.9rem}
.lvl.done{border-color:var(--good);background:linear-gradient(var(--good-weak),var(--surface))}
.stars{letter-spacing:2px;color:var(--gold);min-height:1.5em}
.intro{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.intro .big{font-size:3rem}
.bar{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#e8590c,#f5b400);transition:width .4s}
.back{margin-bottom:10px}
h2{margin:.2rem 0 .4rem}
.tip{background:var(--accent-weak);border-left:5px solid var(--accent);padding:10px 14px;border-radius:8px;margin:12px 0;font-size:.95rem}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:12px 16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-weak);border-color:var(--good)}
.opt.wrong{background:var(--bad-weak);border-color:var(--bad);animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.6em;font-weight:600}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
mark{background:#ffe27a;color:#222;padding:0 5px;border-radius:5px;font-weight:700}
.sent{font-size:1.25rem;background:var(--surface-2);border-radius:12px;padding:14px 16px;margin:10px 0}
.steps{counter-reset:s;list-style:none;padding:0}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.mc{min-height:90px;border-radius:12px;border:2px solid var(--line);background:linear-gradient(135deg,#e8590c,#f5b400);color:transparent;font-size:.9rem;padding:6px;line-height:1.25}
.mc.open{background:var(--surface-2);color:var(--text)}
.mc.ok{background:var(--good-weak);color:var(--text);border-color:var(--good)}
.tok{display:inline-block;margin:3px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-size:1.1rem}
.tok:hover:not(:disabled){border-color:var(--accent)}
.tok:disabled{opacity:.35}
.build{min-height:56px;background:var(--surface-2);border:2px dashed var(--line);border-radius:12px;padding:8px;margin:10px 0;font-size:1.2rem}
.err{cursor:pointer;display:inline-block;padding:2px 6px;margin:1px;border-radius:6px;border:2px solid transparent;background:none;font-size:1.25rem}
.err:hover{background:var(--accent-weak)}
.err.bad{background:var(--bad-weak);border-color:var(--bad)}
.err.ok{background:var(--good-weak);border-color:var(--good)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.big-btn{border:0;border-radius:12px;padding:16px 6px;color:#fff;font-weight:700;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.hearts{font-size:1.4rem}
.cert{text-align:center;border:6px double var(--gold);background:var(--surface);padding:30px;border-radius:12px}
.cert h2{font-size:2rem;color:var(--accent)}
.cert .name{font-size:2rem;font-weight:800;border-bottom:3px solid var(--gold);display:inline-block;padding:0 20px}
input[type=text]{font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);width:100%;max-width:300px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:99}
@media print{body{background:#fff}.no-print{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top no-print">
    <h1>✍️ Grammatikrallyt <small style="font-weight:400;color:var(--soft)">· åk 4–6</small></h1>
    <span class="pill" id="xp">⭐ 0 poäng</span>
    <button class="btn ghost" id="resetBtn">Börja om</button>
  </header>
  <main id="app"></main>
</div>
<script>
'use strict';
const KEY='grammatik-mellanstadiet:v1';
let S={name:'',lv:{}};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.lv) S=s; }catch(e){}
const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} };
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const total=()=>Object.values(S.lv).reduce((n,l)=>n+l.xp,0);
const stars=m=>m===0?3:m<=2?2:1;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const p=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,c:`hsl(${Math.random()*360},90%,60%)`,s:5+Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);p.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.35;x.fillStyle=a.c;x.fillRect(a.x,a.y,a.s,a.s);});
    if(++t<110)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();
}

/* Quiz: första alternativet är rätt. Q.s = valfri mening som visas (HTML). */
function quiz(box,questions,done){
  let i=0,mistakes=0;const q=shuffle(questions);
  (function show(){
    const Q=q[i];
    box.innerHTML=`<div class="bar"><i style="width:${i/q.length*100}%"></i></div>
      <p><b>Fråga ${i+1} av ${q.length}</b></p><h3>${Q.q}</h3>${Q.s?`<div class="sent">${Q.s}</div>`:''}
      <div class="opts">${shuffle(Q.o.map((t,k)=>({t,k}))).map(o=>`<button class="opt" data-k="${o.k}">${o.t}</button>`).join('')}</div>
      <div class="fb" aria-live="polite"></div><div id="nx"></div>`;
    const fb=$('.fb',box);
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.k===0){
        b.classList.add('right');box.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        fb.className='fb good';fb.textContent='✅ Rätt! '+Q.why;
        $('#nx').innerHTML=`<button class="btn">${i+1<q.length?'Nästa →':'Klart! 🎉'}</button>`;
        $('#nx .btn').onclick=()=>{ if(++i<q.length)show(); else done(mistakes); };
        $('#nx .btn').focus();
      }else{mistakes++;b.classList.add('wrong');b.disabled=true;fb.className='fb bad';fb.textContent='❌ Inte riktigt – försök igen!';}
    });
  })();
}

/* Memory */
function memory(box,pairs,done){
  const cards=shuffle(pairs.flatMap((p,k)=>[{k,t:p[0]},{k,t:p[1]}]));
  let first=null,lock=false,found=0,mistakes=0;
  box.innerHTML=`<div class="mem">${cards.map((c,n)=>`<button class="mc" data-n="${n}" aria-label="Kort ${n+1}">❓</button>`).join('')}</div><div class="fb" aria-live="polite"></div>`;
  const fb=$('.fb',box);
  box.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('open')||b.classList.contains('ok'))return;
    const c=cards[+b.dataset.n];b.classList.add('open');b.textContent=c.t;
    if(!first){first=b;return;}
    const a=cards[+first.dataset.n];
    if(a.k===c.k){first.className=b.className='mc ok';first=null;fb.className='fb good';fb.textContent='✅ Ett par!';
      if(++found===pairs.length)setTimeout(()=>done(Math.floor(mistakes/2)),600);}
    else{mistakes++;lock=true;fb.className='fb bad';fb.textContent='❌ Inte ett par – titta noga.';
      const f=first;first=null;setTimeout(()=>{[f,b].forEach(x=>{x.classList.remove('open');x.textContent='❓';});lock=false;},900);}
  });
}

/* Bygg en mening: klicka orden i rätt ordning */
const norm=s=>s.toLowerCase().replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();
function build(box,items,done){
  const P=shuffle(items);let i=0,mistakes=0;
  (function show(){
    const it=P[i];let chosen=[];
    box.innerHTML=`<div class="bar"><i style="width:${i/P.length*100}%"></i></div><p><b>Mening ${i+1} av ${P.length}</b> – ${it.hint}</p>
     <div class="build" id="bd" aria-live="polite"></div><div id="tk"></div>
     <div class="row"><button class="btn" id="ck" disabled>Kolla</button><button class="btn ghost" id="cl">Rensa</button></div><div class="fb" aria-live="polite"></div><div id="nx"></div>`;
    const tk=$('#tk',box),bd=$('#bd',box),ck=$('#ck',box),fb=$('.fb',box);
    const draw=()=>{
      bd.textContent=chosen.map(c=>c.t).join(' ');
      tk.innerHTML='';
      it.w.map((t,k)=>({t,k})).forEach(o=>{
        const b=document.createElement('button');b.className='tok';b.textContent=o.t;b.disabled=chosen.some(c=>c.k===o.k);
        b.onclick=()=>{chosen.push(o);draw();};tk.appendChild(b);
      });
      ck.disabled=chosen.length!==it.w.length;
    };
    $('#cl',box).onclick=()=>{chosen=[];fb.textContent='';draw();};
    ck.onclick=()=>{
      const s=norm(chosen.map(c=>c.t).join(' '));
      if(it.ok.map(norm).includes(s)){
        fb.className='fb good';fb.textContent='✅ Rätt! '+it.why;ck.disabled=true;tk.querySelectorAll('button').forEach(b=>b.disabled=true);
        $('#nx',box).innerHTML=`<button class="btn">${i+1<P.length?'Nästa →':'Klart! 🎉'}</button>`;
        $('#nx .btn',box).onclick=()=>{ if(++i<P.length)show(); else done(mistakes); };
      }else{mistakes++;fb.className='fb bad';fb.textContent='❌ Inte rätt ordföljd – tänk på verbet och på "inte". Rensa och försök igen.';}
    };
    draw();
  })();
}

/* Hitta felet */
function findError(box,items,done){
  const P=shuffle(items);let i=0,mistakes=0;
  (function show(){
    const it=P[i];
    box.innerHTML=`<div class="bar"><i style="width:${i/P.length*100}%"></i></div><p><b>Mening ${i+1} av ${P.length}</b> – klicka på ordet som är fel.</p>
     <div class="sent">${it.t.map((w,k)=>`<button class="err" data-k="${k}">${esc(w)}</button>`).join(' ')}</div><div class="fb" aria-live="polite"></div><div id="nx"></div>`;
    const fb=$('.fb',box);
    box.querySelectorAll('.err').forEach(b=>b.onclick=()=>{
      if(it.e.includes(+b.dataset.k)){
        it.e.forEach(k=>box.querySelector(`.err[data-k="${k}"]`).classList.add('ok'));
        box.querySelectorAll('.err').forEach(x=>x.disabled=true);
        fb.className='fb good';fb.textContent='✅ Rätt! '+it.why;
        $('#nx',box).innerHTML=`<button class="btn">${i+1<P.length?'Nästa →':'Klart! 🎉'}</button>`;
        $('#nx .btn',box).onclick=()=>{ if(++i<P.length)show(); else done(mistakes); };
      }else{mistakes++;b.classList.add('bad');b.disabled=true;fb.className='fb bad';fb.textContent='❌ Det ordet är rätt – leta vidare!';}
    });
  })();
}

/* Två val, valfritt med liv */
function classify(box,items,labels,done,lives=0){
  const P=shuffle(items);let i=0,L=lives,mistakes=0;
  (function show(){
    box.innerHTML=`${lives?`<p class="hearts" aria-label="${L} liv kvar">${'❤️'.repeat(L)}${'🖤'.repeat(lives-L)}</p>`:''}
     <div class="bar"><i style="width:${i/P.length*100}%"></i></div>
     <h3 style="margin-bottom:0">${P[i][0]}</h3>
     <div class="two">${labels.map(l=>`<button class="big-btn" style="background:${l[1]}">${l[0]}</button>`).join('')}</div><div class="fb" aria-live="polite"></div>`;
    box.querySelectorAll('.big-btn').forEach((b,k)=>b.onclick=()=>{
      if(labels[k][0]===P[i][1]){ if(++i===P.length)return done(mistakes); show(); }
      else{mistakes++;
        if(lives&&--L===0){box.innerHTML=`<p class="fb bad">💀 Slut på liv! Försök igen.</p><button class="btn" id="re">Försök igen</button>`;$('#re',box).onclick=()=>{i=0;L=lives;mistakes=0;show();};return;}
        show();$('.fb',box).className='fb bad';$('.fb',box).textContent='❌ Fel! '+(P[i][2]||'');}
    });
  })();
}

const ch2=(q,r,w,why)=>({q,o:[r,...w],why});
const wc=(s,m,right,wrong,why)=>({q:'Vilken ordklass är det markerade ordet?',s:s.replace(m,`<mark>${m}</mark>`),o:[right,...wrong],why});
const sa=(s,m,right,why)=>({q:'Är den markerade delen en huvudsats eller en bisats?',s:s.replace(m,`<mark>${m}</mark>`),o:[right,right==='Huvudsats'?'Bisats':'Huvudsats'],why});
const sp=(r,w,why)=>({q:'Vilken mening är rätt skriven?',o:[r,w],why});
const bj=(q,r,w,why)=>({q,o:[r,...w],why});

const W={ord:['Ord','#e8590c'],mening:['Meningar','#2b7de9'],rattskrivet:['Rätt skrivet','#2f9e44'],stil:['Språk & stil','#9c36b5']};
const LEVELS=[
{w:'ord',ico:'🏷️',title:'Ordklasserna',sub:'Substantiv, verb, adjektiv m.fl.',
 intro:'Vilken <b>ordklass</b> har det markerade ordet?',tip:'Substantiv = person, sak, plats · Verb = göra/vara · Adjektiv = beskriver · Adverb = berättar hur, när, var.',
 run:(b,d)=>quiz(b,[
  wc('Katten sover på soffan.','sover','Verb',['Substantiv','Adjektiv','Adverb'],'"Sover" berättar vad katten gör.'),
  wc('Katten sover på soffan.','Katten','Substantiv',['Verb','Adjektiv','Pronomen'],'Katt är ett djur – substantiv.'),
  wc('En snabb bil körde förbi.','snabb','Adjektiv',['Adverb','Substantiv','Verb'],'"Snabb" beskriver bilen.'),
  wc('Hon läser en bok.','Hon','Pronomen',['Substantiv','Adjektiv','Verb'],'Pronomen ersätter ett substantiv: hon, han, den.'),
  wc('Boken ligger på bordet.','på','Preposition',['Konjunktion','Adverb','Pronomen'],'Prepositioner visar läge: på, under, i, bakom.'),
  wc('Jag gillar kaffe och te.','och','Konjunktion',['Preposition','Adverb','Verb'],'Konjunktioner binder ihop: och, men, eller.'),
  wc('Han springer fort.','fort','Adverb',['Adjektiv','Substantiv','Preposition'],'"Fort" berättar hur han springer.'),
  wc('Hon har tre syskon.','tre','Räkneord',['Substantiv','Adjektiv','Pronomen'],'Räkneord anger antal.')
 ],d)},
{w:'ord',ico:'🧩',title:'Begreppsmemory',sub:'Hitta par: begrepp och förklaring',
 intro:'Vänd två kort i taget och para ihop <b>begrepp</b> med <b>förklaring</b>.',tip:'Du ska kunna prata om språket med rätt ord.',
 run:(b,d)=>memory(b,[['Substantiv','Ord för personer, saker och platser'],['Verb','Ord som visar vad någon gör eller är'],['Adjektiv','Ord som beskriver ett substantiv'],['Synonym','Ord som betyder nästan samma sak'],['Motsats','Ord som betyder tvärtom: stor – liten'],['Sammansatt ord','Två ord som blivit ett: sol + glasögon']],d)},
{w:'ord',ico:'🔄',title:'Böjning',sub:'Plural, dåtid och bestämd form',
 intro:'Välj <b>rätt böjd form</b> av ordet.',tip:'Plural = fler än en (bok → böcker). Dåtid = det som har hänt (springer → sprang). Bestämd form = en bil → bilen.',
 run:(b,d)=>quiz(b,[
  bj('Vad är plural av <b>bok</b>?','böcker',['bokar','boker'],'Bok → böcker.'),
  bj('Vad är plural av <b>flicka</b>?','flickor',['flickar','flicker'],'Ord på -a får oftast -or.'),
  bj('Vad är plural av <b>pojke</b>?','pojkar',['pojkor','pojker'],'Pojke → pojkar.'),
  bj('Vad är dåtid av <b>springa</b>?','sprang',['springde','sprungit'],'Idag springer jag, igår sprang jag.'),
  bj('Vad är dåtid av <b>äta</b>?','åt',['åtte','ätit'],'Idag äter jag, igår åt jag.'),
  bj('Vad är dåtid av <b>skriva</b>?','skrev',['skrivde','skrivit'],'Idag skriver jag, igår skrev jag.'),
  bj('Vad är bestämd form av <b>en bil</b>?','bilen',['bilet','bilarn'],'En bil → bilen.'),
  bj('Vad är bestämd form av <b>ett äpple</b>?','äpplet',['äppelet','äpplen'],'Ett äpple → äpplet.')
 ],d)},
{w:'mening',ico:'🧱',title:'Huvudsats & bisats',sub:'Kan satsen stå själv?',
 intro:'Är den markerade delen en <b>huvudsats</b> eller en <b>bisats</b>?',tip:'En <b>huvudsats</b> kan stå själv som en hel mening. En <b>bisats</b> kan inte det – den börjar ofta med <i>att, eftersom, när, om</i>.',
 run:(b,d)=>quiz(b,[
  sa('Jag stannar hemma eftersom det regnar.','eftersom det regnar','Bisats','Den kan inte stå själv.'),
  sa('Jag stannar hemma eftersom det regnar.','Jag stannar hemma','Huvudsats','"Jag stannar hemma" fungerar som en egen mening.'),
  sa('När solen går upp, vaknar fåglarna.','När solen går upp','Bisats','Börjar med "när" och kan inte stå själv.'),
  sa('Jag vet att du är snäll.','att du är snäll','Bisats','Börjar med "att".'),
  sa('Vi åt glass.','Vi åt glass','Huvudsats','En hel egen mening.'),
  sa('Hunden skäller och katten flyr.','Hunden skäller','Huvudsats','Båda delarna kan stå själva.')
 ],d)},
{w:'mening',ico:'🧩',title:'Bygg meningen',sub:'Ordföljd',
 intro:'Klicka orden i en <b>rätt</b> ordning. Ibland finns flera rätta svar!',tip:'Verbet står oftast på <b>plats två</b>: <i>Igår <u>åt</u> jag glass.</i>',
 run:(b,d)=>build(b,[
  {w:['jag','åt','glass','igår'],hint:'Börja med "jag" eller med "igår".',ok:['Jag åt glass igår','Igår åt jag glass'],why:'Verbet "åt" står på plats två.'},
  {w:['min','hund','heter','Bosse'],hint:'Vad heter hunden?',ok:['Min hund heter Bosse'],why:'Min hund + heter + Bosse.'},
  {w:['på','lördag','åker','vi','till','Göteborg'],hint:'Börja med "på lördag" eller med "vi".',ok:['På lördag åker vi till Göteborg','Vi åker till Göteborg på lördag'],why:'Verbet står på plats två.'},
  {w:['när','det','regnar','tar','jag','paraply'],hint:'Börja med bisatsen eller med "jag".',ok:['När det regnar tar jag paraply','Jag tar paraply när det regnar'],why:'Efter en inledande bisats kommer verbet först i huvudsatsen.'},
  {w:['jag','tror','att','det','blir','kallt'],hint:'Det finns en bisats med "att".',ok:['Jag tror att det blir kallt'],why:'"Att det blir kallt" är en bisats.'}
 ],d)},
{w:'rattskrivet',ico:'✏️',title:'Stavning',sub:'Dubbelteckning och vanliga ord',
 intro:'Välj den mening som är <b>rätt stavad</b>.',tip:'Efter en kort vokal kommer ofta <b>två</b> likadana konsonanter: <i>kallt</i>, <i>snabbt</i>, <i>spännande</i>.',
 run:(b,d)=>quiz(b,[
  sp('Det är kallt ute.','Det är kalt ute.','Kallt skrivs med dubbel-l och t.'),
  sp('Han springer snabbt.','Han springer snabt.','Snabbt skrivs med dubbel-b.'),
  sp('Hon är ledsen.','Hon är lesen.','Ledsen skrivs med d.'),
  sp('Jag ska göra läxan.','Jag ska göra lexan.','Läxa skrivs med x: lä-x-a.'),
  sp('Vi spelar fotboll på rasten.','Vi spelar fotball på rasten.','Fotboll skrivs med -boll.'),
  sp('Hon läste en spännande bok.','Hon läste en spännade bok.','Spännande har två n.')
 ],d)},
{w:'rattskrivet',ico:'❗',title:'Skiljetecken & stor bokstav',sub:'Punkt, fråga, komma, citattecken',
 intro:'Välj den mening som är <b>rätt skriven</b>.',tip:'Stor bokstav i början av meningen och på namn. Veckodagar och månader har <b>liten</b> bokstav.',
 run:(b,d)=>quiz(b,[
  sp('Vad heter du?','Vad heter du.','En fråga slutar med frågetecken.'),
  sp('Idag är det måndag.','Idag är det Måndag.','Veckodagar skrivs med liten bokstav.'),
  sp('Jag har en hund, en katt och en fisk.','Jag har en hund en katt, och en fisk.','Komma mellan sakerna i en uppräkning, men inte före "och".'),
  sp('"Kom hit!" ropade mamma.','Kom hit! ropade mamma.','Det som sägs sätts inom citattecken.'),
  sp('Stockholm är Sveriges huvudstad.','stockholm är sveriges huvudstad.','Namn och meningens första ord får stor bokstav.'),
  sp('Wow, vad fint!','Wow, vad fint?','Utropstecken när man är glad eller överraskad.')
 ],d)},
{w:'rattskrivet',ico:'🕵️',title:'Felfångaren',sub:'Hitta felet i meningen',
 intro:'Varje mening innehåller ett fel. <b>Klicka på det felaktiga ordet.</b>',tip:'Tänk på dåtid (sprang, åt), en/ett och att orden ska passa ihop: <i>trevliga kompisar</i>.',
 run:(b,d)=>findError(b,[
  {t:'Pojken springade fort.'.split(' '),e:[1],why:'Dåtid av springa är "sprang".'},
  {t:'Jag har ett bil.'.split(' '),e:[2],why:'Det heter "en bil".'},
  {t:'Igår gick jag till skolen.'.split(' '),e:[4],why:'Rätt: "skolan".'},
  {t:'Hon har två hundar och en katter.'.split(' '),e:[5,6],why:'En katt – bara en, alltså singular.'},
  {t:'Det var en jätte rolig film.'.split(' '),e:[3,4],why:'Skrivs ihop: "jätterolig".'},
  {t:'Mina kompisar är snälla och trevlig.'.split(' '),e:[5],why:'Flera kompisar → "trevliga".'},
  {t:'Dom lekte på rasten.'.split(' '),e:[0],why:'I skrift: "De lekte på rasten."'}
 ],d)},
{w:'stil',ico:'🎩',title:'Formellt eller vardagligt?',sub:'Hur du låter mot olika personer',
 intro:'Är uttrycket <b>formellt</b> eller <b>vardagligt</b>?',tip:'Mot kompisar får du prata vardagligt. Mot rektorn eller i ett brev är det bra att vara <b>formell</b>.',
 run:(b,d)=>classify(b,[
  ['Hej kompis!','Vardagligt'],['Kära rektor,','Formellt'],['Tjena, läget?','Vardagligt'],['Med vänlig hälsning','Formellt'],
  ['Asså det var skitkul!','Vardagligt'],['Tack för att du lyssnade.','Formellt'],['Vad händer?','Vardagligt'],['Jag vill gärna ställa en fråga.','Formellt']
 ].map(x=>[...x,'Tänk på vem du pratar eller skriver till.']),[['Formellt','#2b7de9'],['Vardagligt','#e8590c']],d)},
{w:'stil',ico:'🗺️',title:'Språken i Sverige',sub:'Dialekter, grannspråk och minoritetsspråk',
 intro:'Svenska är inte det enda språket i Sverige och Norden. Vad vet du?',tip:'Sveriges nationella minoritetsspråk är <b>finska, meänkieli, samiska, romani chib och jiddisch</b>.',
 run:(b,d)=>quiz(b,[
  ch2('Vilket språk är ett nationellt minoritetsspråk i Sverige?','Samiska',['Franska','Tyska'],'Samiska är ett av fem nationella minoritetsspråk.'),
  ch2('Vilket språk är ett nordiskt grannspråk som liknar svenska?','Norska',['Spanska','Italienska'],'Norska och danska är grannspråk till svenskan.'),
  ch2('Vad är en dialekt?','Ett sätt att tala som är typiskt för en del av landet',['Ett helt annat språk','Ett fel sätt att prata'],'Skånska, gotländska och norrländska är exempel.'),
  ch2('Var talas skånska?','I Skåne',['I Norrland','På Gotland'],'Skånska är en dialekt i södra Sverige.'),
  ch2('Var talas meänkieli främst?','I Tornedalen',['I Skåne','På Öland'],'Meänkieli talas i norra Sverige längs Torne älv.'),
  ch2('Vad är slang?','Informella ord som ofta används av unga',['Fint språk i brev','Ett främmande språk'],'Slang passar bäst med kompisar.')
 ],d)},
{w:'stil',ico:'👑',title:'Grammatikbossen',sub:'Rätt eller fel – 3 liv',
 intro:'Är påståendet <b>rätt</b> eller <b>fel</b>? Du har tre liv!',tip:'Titta tillbaka på tipsen från de andra banorna.',
 run:(b,d)=>classify(b,[
  ['Ett substantiv är ett ord för en person, sak eller plats.','Rätt'],
  ['En mening börjar med stor bokstav.','Rätt'],
  ['Veckodagar skrivs med stor bokstav.','Fel','De skrivs med liten bokstav.'],
  ['Ett verb berättar vad någon gör.','Rätt'],
  ['Plural av pojke är pojkor.','Fel','Det är pojkar.'],
  ['Ett adjektiv beskriver ett substantiv.','Rätt'],
  ['En bisats kan stå helt själv.','Fel','Det är huvudsatsen som kan stå själv.'],
  ['Efter ett frågetecken skrivs ingen punkt.','Rätt'],
  ['Synonymer är ord som betyder nästan samma sak.','Rätt'],
  ['Dåtid av äta är "ätte".','Fel','Det är "åt".'],
  ['Finska är ett av Sveriges nationella minoritetsspråk.','Rätt']
 ],[['Rätt','#2f9e44'],['Fel','#c92a2a']],d,3)}
];
LEVELS.forEach((l,n)=>l.id='l'+n);

function updXP(){ $('#xp').textContent='⭐ '+total()+' poäng'; }
function hub(){
  updXP();
  const doneN=LEVELS.filter(l=>S.lv[l.id]).length;
  app.innerHTML=`<div class="card intro"><div class="big">📚</div><div style="flex:1;min-width:220px"><h2>Välkommen, språkmästare!</h2>
    <p style="margin:0">Träna <b>svenska</b> för åk 4–6: ordklasser, böjning, huvudsats och bisats, stavning och skiljetecken. Klara alla ${LEVELS.length} banor och få ett diplom.</p>
    <div class="bar"><i style="width:${doneN/LEVELS.length*100}%"></i></div><small>${doneN} av ${LEVELS.length} banor klara</small></div></div>
    ${Object.keys(W).map(w=>`<section class="world" style="--c:${W[w][1]}"><h3>${W[w][0]}</h3><div class="hub">${LEVELS.filter(l=>l.w===w).map(l=>`<button class="lvl ${S.lv[l.id]?'done':''}" data-id="${l.id}"><div class="ico">${l.ico}</div><h4>${l.title}</h4><p>${l.sub}</p><div class="stars">${S.lv[l.id]?'★'.repeat(S.lv[l.id].st)+'☆'.repeat(3-S.lv[l.id].st):'☆☆☆'}</div></button>`).join('')}</div></section>`).join('')}
    ${doneN===LEVELS.length?'<p style="text-align:center;margin-top:20px"><button class="btn" id="cert">🏆 Visa mitt diplom</button></p>':''}`;
  app.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>play(LEVELS.find(l=>l.id===b.dataset.id)));
  const c=$('#cert');if(c)c.onclick=certificate;
}
function play(L){
  app.innerHTML=`<button class="btn ghost back" id="bk">← Tillbaka till kartan</button>
   <div class="card"><h2>${L.ico} ${L.title}</h2><p>${L.intro}</p><div class="tip">💡 ${L.tip}</div><div id="game"></div></div>`;
  $('#bk').onclick=hub;scrollTo(0,0);
  L.run($('#game'),m=>finish(L,m));
}
function finish(L,m){
  const st=stars(m),xp=Math.max(40,100-m*10),old=S.lv[L.id];
  if(!old||xp>old.xp)S.lv[L.id]={st,xp};save();updXP();confetti();
  const next=LEVELS[LEVELS.indexOf(L)+1],all=LEVELS.every(l=>S.lv[l.id]);
  $('#game').innerHTML=`<div style="text-align:center"><div style="font-size:4rem">🎉</div><h2>Bana klar!</h2>
   <div class="stars" style="font-size:2.2rem">${'★'.repeat(st)+'☆'.repeat(3-st)}</div><p>+${xp} poäng · ${m} misstag</p>
   <div class="row" style="justify-content:center"><button class="btn ghost" id="again">Spela om</button>
   ${all?'<button class="btn" id="cert">🏆 Se ditt diplom</button>':next?'<button class="btn" id="nxt">Nästa bana →</button>':'<button class="btn" id="mp">Till kartan</button>'}</div></div>`;
  $('#again').onclick=()=>play(L);
  const a=$('#nxt');if(a)a.onclick=()=>play(next);
  const b=$('#cert');if(b)b.onclick=certificate;
  const c=$('#mp');if(c)c.onclick=hub;
}
function certificate(){
  if(!S.name){
    app.innerHTML=`<div class="card"><h2>🏆 Nästan klart!</h2><p>Skriv ditt namn till diplomet:</p><div class="row"><input type="text" id="nm" placeholder="Förnamn Efternamn" aria-label="Ditt namn"><button class="btn" id="ok">Visa diplom</button></div></div>`;
    $('#ok').onclick=()=>{const v=$('#nm').value.trim();if(v){S.name=v;save();certificate();}};return;
  }
  const xp=total(),max=LEVELS.length*100;
  const rank=xp>=max*.9?'Grammatikmästare 👑':xp>=max*.75?'Språkproffs 🚀':'Språklärling ✏️';
  app.innerHTML=`<div class="cert"><div style="font-size:3rem">🏆</div><h2>Diplom</h2><p>Detta diplom tilldelas</p>
   <p><span class="name">${esc(S.name)}</span></p><p>som klarade alla ${LEVELS.length} banor i Grammatikrallyt<br>med <b>${xp} av ${max} poäng</b></p><h3>${rank}</h3></div>
   <p class="no-print" style="text-align:center"><button class="btn" onclick="print()">🖨️ Skriv ut</button> <button class="btn ghost" id="bk">Till kartan</button></p>`;
  $('#bk').onclick=hub;confetti();
}
$('#resetBtn').onclick=()=>{ if(confirm('Börja om och nollställa alla poäng?')){S={name:'',lv:{}};save();hub();} };
hub();
</script>
</body>
</html>
