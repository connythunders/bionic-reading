<!DOCTYPE html>
<html lang="sv" data-storlek="2">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matteträning</title>
<meta name="description" content="Lugn matteträning för åk 7–9, ett steg i taget.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f6f6a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="hoppa" href="#huvud">Hoppa till innehållet</a>

<header class="topp">
  <a href="#/" class="topp-hem" aria-label="Till startsidan">🏠 <span>Start</span></a>
  <span class="topp-titel">Matteträning</span>
  <a href="#/installningar" class="topp-inst" aria-label="Inställningar">⚙️ <span>Inställningar</span></a>
</header>

<main id="huvud" tabindex="-1"></main>

<nav class="verktygsrad" aria-label="Verktyg">
  <button type="button" data-verktyg-knapp="kalk" aria-pressed="false">🧮<span>Miniräknare</span></button>
  <button type="button" data-verktyg-knapp="kladd" aria-pressed="false">✏️<span>Kladd</span></button>
  <button type="button" data-verktyg-knapp="formel" aria-pressed="false">📐<span>Formelblad</span></button>
</nav>

<section class="verktyg-panel" id="verktygPanel" role="dialog" aria-labelledby="verktygTitel" hidden>
  <div class="verktyg-huvud">
    <h2 id="verktygTitel">Verktyg</h2>
    <button type="button" class="knapp liten" id="verktygStang">Stäng ✕</button>
  </div>
  <div class="verktyg-kropp" id="verktygKropp"></div>
</section>

<button type="button" class="tyst-knapp" id="tystKnapp" hidden>⏹ Sluta läsa</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/omraden.js"></script>
<script>
  // Läser in alla moment som har fil: i data/omraden.js. Inget mer behöver ändras här.
  window.MATTE_DATA.omraden.forEach(function (o) { o.moment.forEach(function (m) { if (m.fil) document.write('<script src="data/moment/' + m.fil + '.js"><\/script>'); }); });
</script>
<script src="data/diagnos.js"></script>
<script src="js/motor.js"></script>
<script src="js/visual.js"></script>
<script src="js/visual2.js"></script>
<script src="js/verktyg.js"></script>
<script src="js/app.js"></script>
</body>
</html>
