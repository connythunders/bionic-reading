name: Uppdatera Skolmat

on:
  schedule:
    # GitHub kör cron i UTC. Två tider täcker både sommar- och vintertid;
    # steget "Kontrollera tid" släpper bara igenom körningen som är 07:xx svensk tid.
    - cron: '0 5 * * 1'   # 07:00 CEST (sommartid)
    - cron: '0 6 * * 1'   # 07:00 CET  (vintertid)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollera tid
        id: gate
        run: |
          hour=$(TZ=Europe/Stockholm date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Klockan är $hour i Sverige – hoppar över."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: Main

      - name: Hämta matsedel
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/fetch-skolmat.sh skolmat-data.json

      - name: Committa och pusha
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "Skolmat Bot"
          git config user.email "skolmat-bot@users.noreply.github.com"
          git add skolmat-data.json
          git diff --staged --quiet || git commit -m "Auto: Skolmat $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
