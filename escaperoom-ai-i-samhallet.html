<style>
:root{

    --text:#e9eefb; --soft:#a9b6d3; --line:#31426a;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.55 "Segoe UI",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 14px}
header.top h1{font-size:1.45rem;margin:0;margin-right:auto}
.pill{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700;white-space:nowrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}

.btn:hover{filter:brightness(1.1)} .btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--text);border:2px solid var(--line);box-shadow:none}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}

.door.done .state{color:var(--good)}
.letters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tile{width:46px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:800;font-size:1.5rem}

.back{margin-bottom:10px}
.task{border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0;background:var(--surface-2)}
.task.ok{border-color:var(--good);background:var(--good-weak)}

.row:first-of-type{border-top:0}
.row .t{flex:1 1 320px}
select{max-width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
select:disabled{opacity:.9}
.cloze{line-height:2.4}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}

.opt input{margin-top:.35em;accent-color:var(--accent)}
.ord{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
.ord li{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ord li span{flex:1}
.ord button{border:2px solid var(--line);background:var(--surface-2);border-radius:8px;width:36px;height:36px}

.res{font-weight:700;margin-top:6px}
.res.good{color:var(--good)}.res.bad{color:var(--bad)}
.why{margin-top:6px;font-size:.95rem;color:var(--soft)}
.hintbox{background:var(--accent-weak);border-left:5px solid var(--accent);padding:10px 14px;border-radius:8px;margin:12px 0;font-size:.95rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.facit{margin-top:8px;font-size:.9rem;color:var(--soft)}
.unlock{text-align:center}
.unlock .big{font-size:4rem;font-weight:800;color:var(--good)}
.stars{font-size:2rem;color:var(--gold);letter-spacing:4px}
.diploma{border:6px double var(--accent);text-align:center;padding:28px}
footer{color:var(--soft);font-size:.85rem;text-align:center;padding:20px 0}
.hidden{display:none!important}
@media print{
  body{background:#fff;color:#000}
  .no-print,header.top,footer{display:none!important}
  .card{box-shadow:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

 },
 {

   {type:"quiz", q:"Vilket exempel visar maktkoncentration och global AI-ojämlikhet?", o:["Ett fåtal företag och länder med kapital, datacenter och kompetens drar ifrån medan andra får svårt att delta","Att fler länder delar öppen AI-forskning","Att AI gör vissa yrken mer effektiva","Att EU har infört AI Act"], a:0},
   {type:"quiz", q:"Vad är e-avfall i AI-sammanhang?", o:["Uttjänta grafikkort och specialhårdvara som snabbt blir föråldrad och byts ut","Gamla e-postmeddelanden","Överblivna träningsdata","Raderade AI-konton"], a:0}

];

/* ====================== STATE ====================== */
const KEY = "escape-ai-kap2-v1";
let S = {solved:[], seconds:0, hints:0, wrong:0, finished:false, hinted:[]};
function load(){ try{ const j=JSON.parse(localStorage.getItem(KEY)); if(j&&Array.isArray(j.solved)) S=Object.assign(S,j); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

let view = "hub";
let tick = null;
function fmt(s){ const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0"); }
function updateBar(){
  document.getElementById("time").textContent = fmt(S.seconds);
  document.getElementById("hintc").textContent = S.hints;
  document.getElementById("solvedc").textContent = S.solved.length;
}
function startTimer(){
  if(tick) return;
  tick = setInterval(()=>{
    if(S.finished || document.hidden) return;
    S.seconds++; updateBar();
    if(S.seconds%10===0) save();
  },1000);
}

/* ====================== HJÄLPARE ====================== */
const $ = (sel,root=document)=>root.querySelector(sel);
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(attrs[k]==null) continue;
    if(k==="class") e.className=attrs[k];
    else if(k==="html") e.innerHTML=attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  kids.flat().forEach(c=>{ if(c!=null) e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}
function shuffled(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function shuffledNot(n, ident){ let a; do{ a=shuffled(n); }while(n>1 && a.every((v,i)=>v===ident[i])); return a; }

/* ====================== UPPGIFTSTYPER ======================
   Varje byggare returnerar {el, check()} där check() ger {ok, got, total, lock()} */
function mkTask(q){ return el("div",{class:"task"}, q?el("p",{class:"q"},q):null); }

function buildPairs(t){
  const box = mkTask(t.q), selects=[];
  t.items.forEach(it=>{
    const sel = el("select",{"aria-label":it.t},
      el("option",{value:""},"Välj …"),
      t.opts.map((o,i)=>el("option",{value:i},o)));
    selects.push(sel);
    box.append(el("div",{class:"row"}, el("div",{class:"t"},it.t), sel));
  });
  return {el:box, check(){
    let got=0; selects.forEach((s,i)=>{ if(+s.value===t.items[i].a && s.value!=="") got++; });
    return {got,total:t.items.length,ok:got===t.items.length, lock(){ selects.forEach(s=>s.disabled=true); }};
  }, facit:()=>t.items.map(it=>it.t+" → "+t.opts[it.a]).join(" | ")};
}

function buildCloze(t){
  const box = mkTask(t.q), selects=[];
  const p = el("p",{class:"cloze"});
  t.text.split(/(\{\d+\})/).forEach(part=>{
    const m = part.match(/^\{(\d+)\}$/);
    if(!m){ p.append(part); return; }
    const b=t.blanks[+m[1]];
    const sel = el("select",{"aria-label":"Lucka "+(+m[1]+1)},
      el("option",{value:""},"…"), b.o.map((o,i)=>el("option",{value:i},o)));
    selects.push(sel); p.append(sel);
  });
  box.append(p);
  return {el:box, check(){
    let got=0; selects.forEach((s,i)=>{ if(s.value!=="" && +s.value===t.blanks[i].a) got++; });
    return {got,total:t.blanks.length,ok:got===t.blanks.length, lock(){ selects.forEach(s=>s.disabled=true); }};
  }, facit:()=>t.blanks.map(b=>b.o[b.a]).join(", ")};
}

function buildQuiz(t){
  const box = mkTask(t.q);
  const order = shuffled(t.o.length), name="q"+Math.random().toString(36).slice(2);
  const inputs=[];
  const list = el("div",{class:"opts"});
  order.forEach(i=>{
    const inp = el("input",{type:"radio",name,value:i}); inputs.push(inp);
    list.append(el("label",{class:"opt"}, inp, el("span",{},t.o[i])));
  });
  box.append(list);
  return {el:box, check(){
    const sel = inputs.find(x=>x.checked);
    const ok = !!sel && +sel.value===t.a;
    return {got:ok?1:0,total:1,ok, lock(){ inputs.forEach(x=>x.disabled=true); if(t.why) box.append(el("p",{class:"why"},"💡 "+t.why)); }};
  }, facit:()=>t.o[t.a]};
}

function buildMulti(t){
  const box = mkTask(t.q);
  const order = shuffled(t.o.length), inputs=[];
  const list = el("div",{class:"opts"});
  order.forEach(i=>{
    const inp = el("input",{type:"checkbox",value:i}); inputs.push(inp);
    list.append(el("label",{class:"opt"}, inp, el("span",{},t.o[i])));
  });
  box.append(list);
  return {el:box, check(){
    const picked = inputs.filter(x=>x.checked).map(x=>+x.value).sort((a,b)=>a-b);
    const want = [...t.a].sort((a,b)=>a-b);
    const ok = picked.length===want.length && picked.every((v,i)=>v===want[i]);
    // antal korrekta val (rätt ikryssade + rätt ej ikryssade)
    let got=0; t.o.forEach((_,i)=>{ if(picked.includes(i)===want.includes(i)) got++; });
    return {got,total:t.o.length,ok, lock(){ inputs.forEach(x=>x.disabled=true); }};
  }, facit:()=>t.a.map(i=>t.o[i]).join(" | ")};
}

function buildOrder(t){
  const box = mkTask(t.q);
  const ident=[...t.items.keys()];
  let cur = shuffledNot(t.items.length, ident);
  const ul = el("ol",{class:"ord"});
  let locked=false;
  function paint(){
    ul.innerHTML="";
    cur.forEach((idx,pos)=>{
      ul.append(el("li",{},
        el("b",{},(pos+1)+"."), el("span",{},t.items[idx]),
        el("button",{type:"button","aria-label":"Flytta upp",disabled:locked||pos===0?"":null,onclick:()=>{[cur[pos-1],cur[pos]]=[cur[pos],cur[pos-1]];paint();}},"↑"),
        el("button",{type:"button","aria-label":"Flytta ner",disabled:locked||pos===cur.length-1?"":null,onclick:()=>{[cur[pos+1],cur[pos]]=[cur[pos],cur[pos+1]];paint();}},"↓")));
    });
    ul.querySelectorAll("button").forEach(b=>{ if(b.getAttribute("disabled")==null) b.removeAttribute("disabled"); });
  }
  paint(); box.append(ul);
  return {el:box, check(){
    let got=0; cur.forEach((v,i)=>{ if(v===i) got++; });
    return {got,total:t.items.length,ok:got===t.items.length, lock(){ locked=true; paint(); }};
  }, facit:()=>t.items.map((x,i)=>(i+1)+". "+x).join(" ")};
}
const BUILD={pairs:buildPairs,cloze:buildCloze,quiz:buildQuiz,multi:buildMulti,order:buildOrder};

/* ====================== VYER ====================== */
const app = document.getElementById("app");

function renderHub(){
  view="hub"; app.innerHTML="";
  if(!S.solved.length && S.seconds===0){
    app.append(el("section",{class:"card story"},
      el("h2",{},"🚨 Utelåsta i Server 7"),
      el("p",{},"Du och ditt team har följt med på ett studiebesök i ett datacenter. När ni går mot utgången låser sig alla dörrar."),
      el("div",{class:"orakel"},"ORAKEL> Hej. Jag är systemet som styr den här byggnaden. Åtta dörrar är låsta. Varje dörr öppnas av den som förstår AI:s roll i samhället. Samla bokstäverna. Ordna dem. Säg ordet. Lycka till – jag räknar tiden."),
      el("p",{},el("b",{},"Så funkar det: "),"Öppna ett rum, lös alla uppgifter och tryck ”Kontrollera”. Fastnar ni kan ni använda en ledtråd – men den kostar "+HINT_PENALTY+" sekunder. Rummen kan klaras i valfri ordning. Spela i par eller grupper om 3–4."),
      el("button",{class:"btn",type:"button",onclick:()=>{startTimer();renderHub();}},"Starta klockan")
    ));
    startTimerOnFirstOpen = true;
  }
  app.append(el("h2",{},"Dörrarna"));
  const hub = el("div",{class:"hub"});
  ROOMS.forEach((r,i)=>{
    const done = S.solved.includes(i);
    hub.append(el("button",{class:"door"+(done?" done":""),type:"button",onclick:()=>{startTimer();renderRoom(i);}},
      el("div",{class:"ico"},done?"🔓":"🔒"),
      el("div",{class:"nr"},"RUM "+(i+1)+" "+r.ico),
      el("h4",{},r.name), el("p",{},r.blurb),
      el("div",{class:"state"},done?"Upplåst – bokstav "+WORD[i]:"Låst")));
  });
  app.append(hub);

  const card = el("section",{class:"card"});
  card.append(el("h3",{},"🔑 Utgångsdörren"));
  card.append(el("p",{},"Bokstäverna du hittar visas här i blandad ordning. Ordna dem till ett ord med 8 bokstäver. ",el("b",{},"Ledtråd: "),"enligt kapitlet ligger det alltid hos oss människor."));
  const L = el("div",{class:"letters"});
  TILE_ORDER.forEach(i=>{ const on=S.solved.includes(i); L.append(el("div",{class:"tile"+(on?" on":"")},on?WORD[i]:"?")); });
  card.append(L);
  const open = S.solved.length===ROOMS.length;
  const inp = el("input",{type:"text",maxlength:"20",placeholder:open?"Skriv ordet …":"Lås upp alla rum först","aria-label":"Slutordet",disabled:open?null:""});
  if(open) inp.removeAttribute("disabled");
  const fb = el("div",{class:"fb"});
  const go = ()=>{
    const v = inp.value.trim().toLowerCase().replace(/[^a-zåäö]/g,"");
    if(v===WORD.toLowerCase()){ S.finished=true; save(); renderFinish(); }
    else { S.wrong++; save(); fb.className="fb bad"; fb.textContent="ORAKEL> Fel ord. Dörren förblir låst."; }
  };
  const btn = el("button",{class:"btn",type:"button",onclick:go},"Öppna dörren");
  if(!open) btn.disabled=true;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&open) go(); });
  card.append(el("div",{class:"final"},inp,btn), fb);
  app.append(card);
  updateBar();
}
let startTimerOnFirstOpen=false;

function renderRoom(i){
  view="room"; app.innerHTML="";
  const r = ROOMS[i], done=S.solved.includes(i);
  app.append(el("button",{class:"btn ghost back",type:"button",onclick:renderHub},"← Tillbaka till dörrarna"));
  const card = el("section",{class:"card"});
  card.append(el("h2",{},r.ico+" Rum "+(i+1)+": "+r.name), el("p",{},r.intro));
  const built = r.tasks.map(t=>BUILD[t.type](t));
  built.forEach((b,k)=>{
    card.append(b.el);
    if(TEACHER) b.el.append(el("details",{class:"facit"},el("summary",{},"Facit (lärare)"),b.facit()));
  });
  const fb = el("div",{class:"fb"});
  const hintBox = el("div",{class:"hintbox hidden"},"💡 "+r.hint);
  if(S.hinted.includes(i)) hintBox.classList.remove("hidden");

  function check(){
    let all=true, got=0, total=0;
    built.forEach(b=>{
      const c=b.check();
      got+=c.got; total+=c.total;
      if(c.ok){ b.el.classList.add("ok"); c.lock(); b.done=true; }
      else { all=false; }
      let res=b.el.querySelector(".res");
      if(!res){ res=el("div",{class:"res"}); b.el.append(res); }
      res.className="res "+(c.ok?"good":"bad");
      res.textContent = c.ok ? "✅ Rätt!" : (c.total>1 ? "❌ "+c.got+" av "+c.total+" rätt – försök igen." : "❌ Inte riktigt – försök igen.");
    });
    if(all){
      if(!S.solved.includes(i)) S.solved.push(i);
      save(); updateBar(); renderUnlocked(i);
    } else {
      S.wrong++; save();
      fb.className="fb bad"; fb.textContent="ORAKEL> Dörren rör sig inte. Kolla rutorna som är markerade med ❌.";
    }
  }
  const bar = el("div",{class:"bar no-print"});
  bar.append(el("button",{class:"btn",type:"button",onclick:check},"Kontrollera"));
  bar.append(el("button",{class:"btn ghost",type:"button",onclick:()=>{
    if(!S.hinted.includes(i)){
      if(!confirm("En ledtråd kostar "+HINT_PENALTY+" sekunder. Vill ni ha den?")) return;
      S.hinted.push(i); S.hints++; S.seconds+=HINT_PENALTY; save(); updateBar();
    }
    hintBox.classList.remove("hidden");
  }},"💡 Ledtråd (+"+HINT_PENALTY+" s)"));
  if(TEACHER) bar.append(el("button",{class:"btn ghost",type:"button",onclick:()=>{ if(!S.solved.includes(i)) S.solved.push(i); save(); updateBar(); renderUnlocked(i); }},"Hoppa över (lärare)"));
  card.append(hintBox, bar, fb);
  if(done) card.prepend(el("div",{class:"hintbox"},"🔓 Det här rummet är redan upplåst. Du kan öva igen om du vill."));
  app.append(card);
  window.scrollTo({top:0});
}

function renderUnlocked(i){
  app.innerHTML="";
  const r=ROOMS[i];
  app.append(el("section",{class:"card unlock"},
    el("div",{class:"ico",style:"font-size:3rem"},"🔓"),
    el("h2",{},"Rum "+(i+1)+" är upplåst!"),
    el("p",{},r.outro),
    el("div",{class:"big","aria-label":"Bokstav "+WORD[i]},WORD[i]),
    el("p",{},"Skriv upp bokstaven – den behövs till slutordet."),
    el("div",{class:"orakel"},"ORAKEL> "+(S.solved.length<ROOMS.length
       ? "Imponerande. "+(ROOMS.length-S.solved.length)+" dörrar kvar."
       : "...Alla dörrar är öppna utom en. Säg ordet.")),
    el("button",{class:"btn",type:"button",onclick:renderHub},S.solved.length<ROOMS.length?"Till nästa dörr":"Till utgångsdörren")
  ));
  window.scrollTo({top:0});
}

function renderFinish(){
  view="finish"; app.innerHTML="";
  const stars = (S.hints<=1 && S.wrong<=8) ? 3 : (S.hints<=4 && S.wrong<=20) ? 2 : 1;
  app.append(el("section",{class:"card diploma"},
    el("div",{style:"font-size:3.5rem"},"🏆"),
    el("h2",{},"Ni har tagit er ut!"),
    el("p",{},"Ordet var ",el("b",{},WORD),": enligt kapitlet ligger ansvaret för hur AI används alltid hos oss människor."),
    el("div",{class:"stars","aria-label":stars+" av 3 stjärnor"},"★".repeat(stars)+"☆".repeat(3-stars)),
    el("p",{},"Tid: ",el("b",{},fmt(S.seconds))," (inklusive tidstillägg) · Ledtrådar: ",el("b",{},String(S.hints))," · Felförsök: ",el("b",{},String(S.wrong))),
    el("div",{class:"orakel"},"ORAKEL> Dörren är öppen. Kom ihåg: AI är varken god eller ond – det avgörs av hur och av vem den används.")
  ));
  app.append(el("section",{class:"card no-print"},
    el("h3",{},"Samtala i gruppen"),
    el("ul",{},
      el("li",{},"Vilket rum var svårast – och vad lärde ni er?"),
      el("li",{},"Vilken av de fem etiska dimensionerna tycker ni är viktigast i skolan? Varför?"),
      el("li",{},"Vem bär ansvaret när en AI gör fel: användaren, företaget eller lagstiftaren?")),
    el("div",{class:"bar"},
      el("button",{class:"btn",type:"button",onclick:()=>window.print()},"Skriv ut"),
      el("button",{class:"btn ghost",type:"button",onclick:resetAll},"Spela igen"))
  ));
  updateBar();
}

function resetAll(){
  S={solved:[],seconds:0,hints:0,wrong:0,finished:false,hinted:[]};
  save(); updateBar(); renderHub();
}
document.getElementById("reset").addEventListener("click",()=>{
  if(confirm("Börja om från början? Tid och upplåsta rum nollställs.")) resetAll();
});

/* ====================== START ====================== */
load();
updateBar();
if(S.finished) renderFinish(); else { if(S.seconds>0||S.solved.length) startTimer(); renderHub(); }
</script>
