<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Word-rallyt: ett spel där eleverna tränar på det som krävs för en bra Word-rapport – rubriker, formatering, innehållsförteckning, bild, tabell, sidnummer och filnamn.">
<title>Word-rallyt – spelet</title>
<style>
:root{
  --bg:#f4f1ff; --surface:#ffffff; --surface-2:#f0eefb;
  --text:#1f2233; --soft:#5a6078; --line:#d9d4f0;
  --accent:#2b579a; --accent-2:#7c4dff; --accent-weak:#e6ecf8;
  --good:#1f7a43; --good-weak:#e2f4e8; --bad:#b3261e; --bad-weak:#fde8e6;
  --gold:#f5b400; --shadow:0 2px 4px rgba(30,20,80,.08),0 10px 30px rgba(30,20,80,.10);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15162a; --surface:#1e2038; --surface-2:#272a47;
    --text:#eceefb; --soft:#aab0cf; --line:#394066;
    --accent:#7aa7f0; --accent-2:#a58bff; --accent-weak:#222f4d;
    --good:#7fd29b; --good-weak:#1b3326; --bad:#f19a94; --bad-weak:#3a2220;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.55 "Segoe UI",system-ui,sans-serif;
  background-image:radial-gradient(circle at 10% 0%,rgba(124,77,255,.15),transparent 40%),radial-gradient(circle at 90% 10%,rgba(43,87,154,.18),transparent 40%)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 16px}
header.top h1{font-size:1.5rem;margin:0;margin-right:auto}
header.top h1 span{color:var(--accent-2)}
.pill{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--text);border:2px solid var(--line);box-shadow:none}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.lvl{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:transform .15s}
.lvl:hover{transform:translateY(-3px) rotate(-.5deg);border-color:var(--accent-2)}
.lvl .ico{font-size:2.2rem}.lvl h3{margin:.2rem 0}.lvl p{margin:0;color:var(--soft);font-size:.9rem}
.lvl.done{border-color:var(--good);background:linear-gradient(var(--good-weak),var(--surface))}
.stars{letter-spacing:2px;color:var(--gold);min-height:1.5em}
.intro{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.intro .big{font-size:3rem}
.bar{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.back{margin-bottom:10px}
h2{margin:.2rem 0 .4rem}
.tip{background:var(--accent-weak);border-left:5px solid var(--accent);padding:10px 14px;border-radius:8px;margin:12px 0;font-size:.95rem}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:12px 16px}
.opt:hover:not(:disabled){border-color:var(--accent-2)}
.opt.right{background:var(--good-weak);border-color:var(--good)}
.opt.wrong{background:var(--bad-weak);border-color:var(--bad);animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.6em;font-weight:600}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
/* Word-lik yta */
.paper{background:#fff;color:#111;border:1px solid #bbb;border-radius:6px;padding:22px 26px;box-shadow:0 4px 14px rgba(0,0,0,.2);margin:12px 0}
.paper .ln{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed #ddd;flex-wrap:wrap}
.paper .txt{flex:1;min-width:200px}
.ribbon{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#2b579a;color:#fff;padding:8px 12px;border-radius:8px 8px 0 0}
.ribbon select,.ribbon button{font:inherit;border-radius:6px;border:0;padding:5px 10px}
.ribbon button{background:#fff;color:#111;min-width:36px}
.ribbon button.on{background:#ffd54a}
.styleBtns{display:flex;gap:6px;flex-wrap:wrap}
.sb{background:var(--surface-2);color:#111;border:2px solid #ccc;border-radius:8px;padding:2px 10px;font-size:.85rem}
.sb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sb.bad{background:var(--bad-weak);border-color:var(--bad)}
.word{cursor:pointer;border-radius:3px;padding:0 1px}.word:hover{background:#e3edff}.word.sel{background:#b7d3ff;outline:1px solid #2b579a}
.goals{list-style:none;padding:0;margin:10px 0}.goals li{padding:3px 0}.goals li.ok{color:var(--good);font-weight:700}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;background:var(--good-weak);border:2px solid var(--good);border-radius:10px;padding:8px 14px;margin:6px 0 6px 0}
.steps li::before{content:counter(s)". ";font-weight:800}
.grid{display:inline-grid;grid-template-columns:repeat(8,34px);gap:3px;margin:10px 0}
.grid i{width:34px;height:34px;background:#fff;border:1px solid #888;display:block;cursor:pointer}
.grid i.hl{background:#9ec5ff;border-color:#2b579a}
table.demo{border-collapse:collapse;background:#fff;color:#111;margin:10px 0}
table.demo td,table.demo th{border:1px solid #555;padding:6px 14px}
table.demo th{background:#dbe5f7}
.cert{text-align:center;border:6px double var(--gold);background:var(--surface);padding:30px;border-radius:12px}
.cert h2{font-size:2rem;color:var(--accent-2)}
.cert .name{font-size:2rem;font-weight:800;border-bottom:3px solid var(--gold);display:inline-block;padding:0 20px}
input[type=text]{font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);width:100%;max-width:260px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.hearts{font-size:1.4rem}
.fname{font-family:Consolas,monospace;background:var(--surface-2);padding:8px 12px;border-radius:8px;display:inline-block;word-break:break-all}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:99}
@media print{body{background:#fff}.no-print{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top no-print">
    <h1>📄 Word<span>-rallyt</span></h1>
    <span class="pill" id="xp">⭐ 0 poäng</span>
    <button class="btn ghost" id="resetBtn" title="Börja om från början">Börja om</button>
  </header>
  <main id="app"></main>
</div>

<script>
'use strict';
/* ---------- Tillstånd ---------- */
const KEY='word-spel:v1';
let S={name:'',lv:{}};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.lv) S=s; }catch(e){}
const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} };
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const total=()=>Object.values(S.lv).reduce((n,l)=>n+l.xp,0);
const stars=m=>m===0?3:m<=2?2:1;

/* ---------- Konfetti ---------- */
function confetti(){
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const p=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,c:`hsl(${Math.random()*360},90%,60%)`,s:5+Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);p.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.35;x.fillStyle=a.c;x.fillRect(a.x,a.y,a.s,a.s);});
    if(++t<110)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();
}

/* ---------- Quiz-motor ---------- */
function quiz(box,questions,done,opts={}){
  let i=0,mistakes=0;
  const q=shuffle(questions);
  (function show(){
    const Q=q[i];
    const order=shuffle(Q.o.map((t,k)=>({t,k})));
    box.innerHTML=`<div class="bar"><i style="width:${i/q.length*100}%"></i></div>
      <p><b>Fråga ${i+1} av ${q.length}</b></p><h3>${Q.q}</h3>
      <div class="opts">${order.map(o=>`<button class="opt" data-k="${o.k}">${o.t}</button>`).join('')}</div>
      <div class="fb" aria-live="polite"></div><div id="nx"></div>`;
    const fb=$('.fb',box);
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.k===0){
        b.classList.add('right');box.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        fb.className='fb good';fb.textContent='✅ Rätt! '+Q.why;
        $('#nx').innerHTML=`<button class="btn">${i+1<q.length?'Nästa →':'Klart! 🎉'}</button>`;
        $('#nx .btn').onclick=()=>{ if(++i<q.length)show(); else done(mistakes); };
        $('#nx .btn').focus();
      }else{
        mistakes++;b.classList.add('wrong');b.disabled=true;
        fb.className='fb bad';fb.textContent='❌ Inte riktigt – försök igen!';
      }
    });
  })();
}

/* ---------- Nivåer ---------- */
const LEVELS=[
{id:'rubrik',ico:'🏷️',title:'Rubrikjakten',sub:'Titel & Rubrik 1',
 intro:'En bra rapport har en <b>titel</b> och rubriker med formatet <b>Rubrik 1</b>. Sätt rätt format på varje rad – <b>alla gånger</b>.',
 tip:'I Word: markera raden → fliken <b>Start</b> → välj en <b>Format</b> (t.ex. Rubrik 1). Att bara göra texten stor och fet räknas <u>inte</u>!',
 run(box,done){
  const lines=[
   {t:'Min rapport om AI',a:'Titel'},{t:'Inledning',a:'Rubrik 1'},
   {t:'Artificiell intelligens betyder att datorer kan lösa uppgifter som annars kräver mänskligt tänkande.',a:'Brödtext'},
   {t:'Hur AI fungerar',a:'Rubrik 1'},
   {t:'En AI lär sig genom att titta på enorma mängder exempel och hitta mönster.',a:'Brödtext'},
   {t:'Slutsats',a:'Rubrik 1'}];
  const st=['Titel','Rubrik 1','Brödtext'];
  let mistakes=0,solved=0;
  box.innerHTML=`<div class="paper">${lines.map((l,n)=>`<div class="ln" data-n="${n}"><span class="txt">${l.t}</span><span class="styleBtns">${st.map(s=>`<button class="sb">${s}</button>`).join('')}</span></div>`).join('')}</div><div class="fb" aria-live="polite"></div>`;
  box.querySelectorAll('.ln').forEach(row=>{
   const L=lines[+row.dataset.n];
   row.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{
    if(row.dataset.ok)return;
    if(b.textContent===L.a){
      b.classList.add('on');row.dataset.ok=1;row.querySelectorAll('.sb').forEach(x=>x.disabled=true);
      const t=$('.txt',row);
      if(L.a==='Titel')t.style.cssText='font-size:2rem;font-weight:800';
      if(L.a==='Rubrik 1')t.style.cssText='font-size:1.5rem;color:#2b579a';
      $('.fb',box).className='fb good';$('.fb',box).textContent='✅ Rätt format!';
      if(++solved===lines.length)setTimeout(()=>done(mistakes),700);
    }else{mistakes++;b.classList.add('bad');$('.fb',box).className='fb bad';
      $('.fb',box).textContent=L.a==='Brödtext'?'❌ Det är vanlig text – Brödtext!':'❌ Hmm, tänk: är det rapportens namn eller ett avsnitt?';}
   });
  });
 }},

{id:'format',ico:'🎨',title:'Formatera-labbet',sub:'Typsnitt, fet, kursiv, justering',
 intro:'Gör texten <b>lättläst</b>! Klicka på ett ord för att markera det och använd verktygsfältet. Alla mål i listan ska bli gröna.',
 tip:'Lättläst = vanligt typsnitt (Calibri, Arial, Times), storlek <b>11–12</b> och snyggt justerad text. Fet/kursiv använder du för att framhäva ord.',
 run(box,done){
  const words='Artificiell intelligens förändrar världen snabbt . Många tror att AI är nytt men forskningen började redan på 1950-talet . Det viktigaste är att vi använder tekniken klokt .'.split(' ');
  const W=words.map(()=>({b:0,i:0}));let sel=-1;
  const P={font:'Papyrus',size:20,align:'center'};
  const fonts={Papyrus:'Papyrus,fantasy','Comic Sans MS':'"Comic Sans MS",cursive',Calibri:'Calibri,sans-serif',Arial:'Arial,sans-serif','Times New Roman':'"Times New Roman",serif'};
  box.innerHTML=`<div class="ribbon">
   <select id="f">${Object.keys(fonts).map(f=>`<option ${f===P.font?'selected':''}>${f}</option>`).join('')}</select>
   <select id="s">${[8,11,12,14,20,28].map(s=>`<option ${s===P.size?'selected':''}>${s}</option>`).join('')}</select>
   <button id="b" title="Fetstil"><b>F</b></button><button id="i" title="Kursiv"><i>K</i></button>
   <button data-al="left" title="Vänsterjustera">⯇ Vänster</button><button data-al="center" title="Centrera">≡ Centrerad</button><button data-al="justify" title="Marginaljustera">☰ Justerad</button></div>
   <div class="paper" id="p" style="margin-top:0;border-radius:0 0 6px 6px"></div>
   <ul class="goals" id="g"></ul><button class="btn" id="go" disabled>Klar!</button>`;
  const p=$('#p',box);
  function draw(){
   p.style.fontFamily=fonts[P.font];p.style.fontSize=P.size+'px';p.style.textAlign=P.align;
   p.innerHTML=words.map((w,n)=>`<span class="word ${n===sel?'sel':''}" data-n="${n}" style="font-weight:${W[n].b?800:400};font-style:${W[n].i?'italic':'normal'}">${w}</span>`).join(' ');
   p.querySelectorAll('.word').forEach(s=>s.onclick=()=>{sel=+s.dataset.n;draw();});
   $('#b',box).classList.toggle('on',sel>=0&&!!W[sel].b);$('#i',box).classList.toggle('on',sel>=0&&!!W[sel].i);
   box.querySelectorAll('[data-al]').forEach(b=>b.classList.toggle('on',b.dataset.al===P.align));
   const goals=[
    ['Minst ett ord i <b>fetstil</b>',W.some(w=>w.b)],
    ['Minst ett ord i <b>kursiv</b>',W.some(w=>w.i)],
    ['Lättläst <b>typsnitt</b> (inte Papyrus eller Comic Sans)',['Calibri','Arial','Times New Roman'].includes(P.font)],
    ['Teckenstorlek <b>11 eller 12</b>',P.size===11||P.size===12],
    ['Texten <b>justerad</b> (vänster eller marginal)',P.align==='left'||P.align==='justify']];
   $('#g',box).innerHTML=goals.map(g=>`<li class="${g[1]?'ok':''}">${g[1]?'✅':'⬜'} ${g[0]}</li>`).join('');
   $('#go',box).disabled=!goals.every(g=>g[1]);
  }
  $('#f',box).onchange=e=>{P.font=e.target.value;draw();};
  $('#s',box).onchange=e=>{P.size=+e.target.value;draw();};
  $('#b',box).onclick=()=>{if(sel>=0){W[sel].b^=1;draw();}};
  $('#i',box).onclick=()=>{if(sel>=0){W[sel].i^=1;draw();}};
  box.querySelectorAll('[data-al]').forEach(b=>b.onclick=()=>{P.align=b.dataset.al;draw();});
  $('#go',box).onclick=()=>done(0);
  draw();
 }},

{id:'innehall',ico:'📑',title:'Innehållsförteckning',sub:'Automatisk + sidbrytning',
 intro:'Klicka på stegen i <b>rätt ordning</b> för att skapa en <b>automatisk innehållsförteckning</b> och en sidbrytning efter den.',
 tip:'Förteckningen blir bara automatisk om rubrikerna har formatet <b>Rubrik 1</b>. Tryck <b>Ctrl + Retur</b> för sidbrytning.',
 run(box,done){
  const steps=['Ge alla rubriker formatet Rubrik 1','Placera markören på sidan efter titelsidan','Referenser → Innehållsförteckning → välj en automatisk','Infoga sidbrytning (Ctrl + Retur) efter förteckningen','Ändrat något? Högerklicka förteckningen → Uppdatera fält'];
  let n=0,mistakes=0;
  box.innerHTML=`<ol class="steps" id="ol"></ol><div class="opts" id="op"></div><div class="fb" aria-live="polite"></div>`;
  const op=$('#op',box),fb=$('.fb',box);
  shuffle(steps.map((t,k)=>({t,k}))).forEach(s=>{
   const b=el(`<button class="opt">${s.t}</button>`);
   b.onclick=()=>{
    if(s.k===n){b.remove();$('#ol',box).insertAdjacentHTML('beforeend',`<li>${s.t}</li>`);n++;fb.className='fb good';fb.textContent='✅ Rätt steg!';
      if(n===steps.length)setTimeout(()=>done(mistakes),700);}
    else{mistakes++;b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);fb.className='fb bad';fb.textContent='❌ Det steget kommer inte nu – vad måste göras först?';}
   };op.appendChild(b);
  });
 }},

{id:'bild',ico:'🖼️',title:'Bildjakten',sub:'Bild, placering & bildtext',
 intro:'Rapporten ska ha <b>minst en bild</b> – placerad på ett lämpligt sätt och med en <b>bildtext</b>.',
 tip:'Infoga → Bilder. Högerklicka på bilden → <b>Infoga bildtext</b>. Bildtexten följer med om du flyttar bilden.',
 run(box,done){
  quiz(box,[
   {q:'Var hittar du knappen för att lägga in en bild?',o:['Fliken Infoga → Bilder','Fliken Start → Teckensnitt','Fliken Granska → Stavning','Fliken Visa → Zoom'],why:'Allt som ska läggas IN i dokumentet finns under Infoga.'},
   {q:'Vilken placering är lämplig för bilden i en rapport?',o:['Bredvid texten eller på egen rad, utan att täcka texten','Ovanpå texten så att man inte kan läsa den','Längst ned på sista sidan, utan koppling till texten','Så stor att den täcker hela sidan'],why:'Bilden ska stödja texten – inte stå i vägen.'},
   {q:'Hur lägger du till en bildtext?',o:['Högerklicka på bilden → Infoga bildtext','Skriv texten med jättestor stil ovanför','Rita en ruta runt bilden','Du behöver ingen bildtext'],why:'Då får bildtexten ett nummer ("Bild 1") och följer bilden.'},
   {q:'Vad ska en bra bildtext göra?',o:['Förklara vad bilden visar','Bara vara ordet "Bild"','Innehålla 10 rader text','Vara dold så ingen ser den'],why:'Kort och tydlig: vad ser läsaren – och varför är det med?'},
   {q:'Bilden hoppar iväg när du skriver mer text. Vad gör du?',o:['Ändrar Radbrytning (Layoutalternativ) så den passar','Raderar hela rapporten','Skriver ut och klipper','Stänger av datorn'],why:'Layoutalternativ vid bilden styr hur den ligger mot texten.'}
  ],done);
 }},

{id:'tabell',ico:'📊',title:'Tabellbyggaren',sub:'Minst 3 kolumner och 4 rader',
 intro:'Bygg en tabell med <b>minst 3 kolumner och 4 rader</b>. Det är samma sak som i Word: Infoga → Tabell och dra över rutorna!',
 tip:'<b>Kolumner</b> går <u>uppåt–nedåt</u> (|||) och <b>rader</b> går <u>i sidled</u> (≡). Rutnätet visar kolumner × rader.',
 run(box,done){
  let mistakes=0;
  box.innerHTML=`<p>Klicka på rutan där du vill att tabellen ska sluta:</p><div class="grid" id="gr"></div><div class="fb" id="lab"><b>0 × 0</b></div><div id="res"></div>`;
  const gr=$('#gr',box);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)gr.insertAdjacentHTML('beforeend',`<i data-c="${c+1}" data-r="${r+1}"></i>`);
  const mark=(c,r)=>{gr.querySelectorAll('i').forEach(i=>i.classList.toggle('hl',+i.dataset.c<=c&&+i.dataset.r<=r));$('#lab',box).innerHTML=`<b>${c} kolumner × ${r} rader</b>`;};
  gr.onmouseover=e=>{if(e.target.dataset.c)mark(+e.target.dataset.c,+e.target.dataset.r);};
  gr.onclick=e=>{
   const t=e.target;if(!t.dataset.c)return;const c=+t.dataset.c,r=+t.dataset.r;mark(c,r);
   const res=$('#res',box);
   if(c>=3&&r>=4){
     gr.style.display='none';
     const head=['År','Händelse','Betydelse'];
     res.innerHTML=`<p class="fb good">✅ Perfekt! En tabell med ${c} kolumner och ${r} rader. Fyll nu i första raden som rubrikrad – vilken är rätt?</p>`;
     const q=document.createElement('div');res.appendChild(q);
     quiz(q,[{q:'Vad ska stå i tabellens första rad?',o:['Rubriker: År | Händelse | Betydelse','Bara siffror','Ingenting – den ska vara tom','Hela rapportens sammanfattning'],why:'Första raden beskriver vad kolumnerna innehåller.'}],m=>done(mistakes+m));
   }else{mistakes++;const f=$('#lab',box);f.className='fb bad';f.innerHTML=`❌ ${c} × ${r} räcker inte – du behöver minst 3 kolumner och 4 rader.`;}
  };
 }},

{id:'sidlayout',ico:'🔢',title:'Sidnummer & layout',sub:'Sidnummer och sidbrytning',
 intro:'En riktig rapport har <b>sidnummer</b> och en <b>sidbrytning</b> mellan innehållsförteckning och text.',
 tip:'Infoga → <b>Sidnummer</b>. Sidbrytning: <b>Ctrl + Retur</b>. Tryck inte Enter 30 gånger!',
 run(box,done){
  quiz(box,[
   {q:'Hur lägger du in sidnummer?',o:['Infoga → Sidnummer','Skriver 1, 2, 3 för hand på varje sida','Start → Fetstil','Layout → Orientering'],why:'Word numrerar alla sidor automatiskt.'},
   {q:'Vad är bästa sättet att få texten på en ny sida?',o:['Sidbrytning (Ctrl + Retur)','Trycka Enter tills texten hamnar på nästa sida','Lägga mellanslag','Göra teckenstorleken 100'],why:'Sidbrytningen ligger kvar rätt även om du lägger till text.'},
   {q:'Var ska sidbrytningen ligga i din rapport?',o:['Mellan innehållsförteckning och rapporttext','Mitt i en mening','Efter varje ord','Det spelar ingen roll'],why:'Då startar själva rapporten snyggt på en ny sida.'},
   {q:'Hur många sidor text ska rapporten minst ha?',o:['Två sidor','Noll sidor','En halv rad','Tjugo sidor'],why:'Minst två sidor text – plus titelsida och innehållsförteckning.'},
   {q:'Du har ändrat en rubrik. Hur får du innehållsförteckningen rätt igen?',o:['Högerklicka → Uppdatera fält','Radera förteckningen och skriv för hand','Starta om datorn','Ingenting – den ändras aldrig'],why:'Automatiska innehållsförteckningar kan uppdateras med ett klick.'}
  ],done);
 }},

{id:'spara',ico:'📤',title:'Spara & lämna in',sub:'Rätt filnamn och Teams',
 intro:'Sista steget! Filen ska heta <span class="fname">Efternamn_Förnamn_Worduppgift.docx</span> och lämnas in i Teams.',
 tip:'Använd understreck _ och inga mellanslag. Efternamn <b>först</b>, förnamn sedan.',
 run(box,done){
  box.innerHTML=`<p>Skriv ditt namn så ser du <b>ditt</b> filnamn:</p>
   <div class="row"><input type="text" id="fn" placeholder="Förnamn" value="${S.name.split(' ')[0]||''}" aria-label="Förnamn"><input type="text" id="en" placeholder="Efternamn" value="${S.name.split(' ').slice(1).join(' ')}" aria-label="Efternamn"></div>
   <p>Ditt filnamn: <span class="fname" id="out">…</span></p><button class="btn" id="nx" disabled>Fortsätt →</button>`;
  const upd=()=>{const f=$('#fn',box).value.trim(),e=$('#en',box).value.trim();
    $('#out',box).textContent=(e||'Efternamn')+'_'+(f||'Förnamn')+'_Worduppgift.docx';
    $('#nx',box).disabled=!(f&&e);S.name=(f+' '+e).trim();save();};
  box.querySelectorAll('input').forEach(i=>i.oninput=upd);upd();
  $('#nx',box).onclick=()=>{
   const f=$('#fn',box).value.trim(),e=$('#en',box).value.trim();
   box.innerHTML='';
   quiz(box,[
    {q:'Vilket filnamn är RÄTT för Anna Svensson?',o:['Svensson_Anna_Worduppgift.docx','Anna Svensson rapport.docx','Dokument1.docx','worduppgift anna.docx'],why:'Efternamn_Förnamn_Worduppgift.docx – exakt så.'},
    {q:'Och för dig? Vilket är ditt rätta filnamn?',o:[`${e}_${f}_Worduppgift.docx`,`${f}_${e}_Worduppgift.docx`,`${f} ${e}.docx`,`Worduppgift.docx`],why:'Efternamnet kommer först!'},
    {q:'Var lämnar du in uppgiften?',o:['I Teams (uppgiften)','Skickar på Snapchat','Lägger på lärarens skrivbord','Ropar in i klassrummet'],why:'Lämna in i Teams och klicka på "Lämna in".'},
    {q:'Du har glömt spara. Vilken genväg sparar?',o:['Ctrl + S','Ctrl + Z','Ctrl + P','Alt + F4'],why:'Ctrl + S sparar – gör det ofta!'}
   ],done);
  };
 }},

{id:'boss',ico:'👑',title:'Slutbossen',sub:'Sant eller falskt – 3 liv!',
 intro:'Du har <b>3 liv</b>. Svara rätt på alla påståenden för att bli Word-mästare!',
 tip:'Tänk på kraven: Rubrik 1, förteckning, bild + bildtext, tabell, sidnummer, filnamn.',
 run(box,done){
  const P=shuffle([
   ['Rubriker ska ha formatet Rubrik 1 för att hamna i innehållsförteckningen.',1],
   ['Det räcker att göra rubriker stora och feta för hand.',0],
   ['Innehållsförteckningen ska skrivas för hand.',0],
   ['Bilden ska ha en bildtext.',1],
   ['Tabellen ska ha minst 3 kolumner och 4 rader.',1],
   ['Man får lämna in filen med namnet "Dokument1".',0],
   ['Sidnummer finns under fliken Infoga.',1],
   ['Sidbrytning gör man med Ctrl + Retur.',1],
   ['Rapporten ska ha minst en sida text.',0],
   ['Titelsidan ska ha ditt namn och din klass.',1]
  ]);
  let i=0,lives=3,mistakes=0;
  (function show(){
   box.innerHTML=`<p class="hearts" aria-label="${lives} liv kvar">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</p>
    <div class="bar"><i style="width:${i/P.length*100}%"></i></div>
    <h3>${P[i][0]}</h3><div class="row"><button class="btn" data-v="1">✅ Sant</button><button class="btn" data-v="0" style="background:#b3261e">❌ Falskt</button></div><div class="fb" aria-live="polite"></div>`;
   box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    if(+b.dataset.v===P[i][1]){ if(++i===P.length)return done(mistakes); show(); }
    else{mistakes++;lives--;
      if(lives===0){box.innerHTML=`<p class="fb bad">💀 Slut på liv! Kolla tipsen i nivåerna och försök igen.</p><button class="btn" id="re">Försök igen</button>`;$('#re',box).onclick=()=>{i=0;lives=3;mistakes=0;show();};}
      else{show();$('.fb',box).className='fb bad';$('.fb',box).textContent='❌ Fel! Du förlorade ett liv.';}}
   });
  })();
 }}
];

/* ---------- Vyer ---------- */
function updXP(){ $('#xp').textContent='⭐ '+total()+' poäng'; }
function hub(){
  updXP();
  const doneN=LEVELS.filter(l=>S.lv[l.id]).length;
  app.innerHTML=`<div class="card intro"><div class="big">🏁</div><div style="flex:1;min-width:220px">
    <h2>Välkommen till Word-rallyt!</h2>
    <p style="margin:0">Klara alla ${LEVELS.length} banor och bli <b>Word-mästare</b>. Banorna övar på precis det som krävs i Word-rapporten.</p>
    <div class="bar"><i style="width:${doneN/LEVELS.length*100}%"></i></div><small>${doneN} av ${LEVELS.length} banor klara</small></div></div>
    <div class="hub">${LEVELS.map((l,n)=>`<button class="lvl ${S.lv[l.id]?'done':''}" data-id="${l.id}"><div class="ico">${l.ico}</div><h3>${n+1}. ${l.title}</h3><p>${l.sub}</p><div class="stars">${S.lv[l.id]?'★'.repeat(S.lv[l.id].st)+'☆'.repeat(3-S.lv[l.id].st):'☆☆☆'}</div></button>`).join('')}</div>
    ${doneN===LEVELS.length?'<p style="text-align:center;margin-top:20px"><button class="btn" id="cert">🏆 Visa mitt diplom</button></p>':''}`;
  app.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>play(LEVELS.find(l=>l.id===b.dataset.id)));
  const c=$('#cert');if(c)c.onclick=certificate;
}
function play(L){
  app.innerHTML=`<button class="btn ghost back" id="bk">← Tillbaka till kartan</button>
   <div class="card"><h2>${L.ico} ${L.title}</h2><p>${L.intro}</p><div class="tip">💡 ${L.tip}</div><div id="game"></div></div>`;
  $('#bk').onclick=hub;scrollTo(0,0);
  L.run($('#game'),m=>finish(L,m));
}
function finish(L,m){
  const st=stars(m),xp=Math.max(40,100-m*10),old=S.lv[L.id];
  if(!old||xp>old.xp)S.lv[L.id]={st,xp};save();updXP();confetti();
  const idx=LEVELS.indexOf(L),next=LEVELS[idx+1],all=LEVELS.every(l=>S.lv[l.id]);
  $('#game').innerHTML=`<div style="text-align:center"><div style="font-size:4rem">🎉</div><h2>Bana klar!</h2>
   <div class="stars" style="font-size:2.2rem">${'★'.repeat(st)+'☆'.repeat(3-st)}</div><p>+${xp} poäng · ${m} misstag</p>
   <div class="row" style="justify-content:center"><button class="btn ghost" id="again">Spela om</button>
   ${all?'<button class="btn" id="cert">🏆 Se ditt diplom</button>':next?`<button class="btn" id="nxt">Nästa bana →</button>`:'<button class="btn" id="mp">Till kartan</button>'}</div></div>`;
  $('#again').onclick=()=>play(L);
  const a=$('#nxt');if(a)a.onclick=()=>play(next);
  const b=$('#cert');if(b)b.onclick=certificate;
  const c=$('#mp');if(c)c.onclick=hub;
}
function certificate(){
  const xp=total(),max=LEVELS.length*100;
  const rank=xp>=max*.9?'Word-mästare 👑':xp>=max*.75?'Word-proffs 🚀':'Word-lärling 📄';
  app.innerHTML=`<div class="cert"><div style="font-size:3rem">🏆</div><h2>Diplom</h2><p>Detta diplom tilldelas</p>
   <p><span class="name">${(S.name||'Word-hjälte').replace(/[<>&]/g,'')}</span></p>
   <p>som klarade alla ${LEVELS.length} banor i Word-rallyt<br>med <b>${xp} av ${max} poäng</b></p><h3>${rank}</h3>
   <p>Nu är det dags att skapa din <b>riktiga rapport i Word</b>!</p></div>
   <p class="no-print" style="text-align:center"><button class="btn" onclick="print()">🖨️ Skriv ut</button> <button class="btn ghost" id="bk">Till kartan</button></p>`;
  $('#bk').onclick=hub;confetti();
}
$('#resetBtn').onclick=()=>{ if(confirm('Börja om och nollställa alla poäng?')){S={name:'',lv:{}};save();hub();} };
hub();
</script>
