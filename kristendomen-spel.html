<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kristendomen – Spelhörnan</title>
<style>
:root{
  --bg:#fdf6e9;
  --card:#ffffff;
  --ink:#2b2438;
  --muted:#6f6682;
  --line:#eadfca;
  --purple:#6d4bd8;
  --purple-d:#5236b0;
  --gold:#f5b73b;
  --green:#2e9d5b;
  --green-bg:#dff5e8;
  --red:#d9473f;
  --red-bg:#fde3e1;
  --blue:#2f7fd6;
  --radius:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
header{background:linear-gradient(135deg,#6d4bd8,#3f2a9c);color:#fff;padding:18px 16px}
.head-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:1.6rem;line-height:1.2}
header p{opacity:.85;font-size:.95rem}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
main{max-width:960px;margin:0 auto;padding:18px 16px 60px}
.back{display:inline-block;margin-bottom:14px;background:none;border:none;color:var(--purple);font-weight:700;text-decoration:underline;padding:4px 0}
a.back{text-decoration:underline}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.game-card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s,box-shadow .12s}
.game-card:hover,.game-card:focus-visible{transform:translateY(-3px);border-color:var(--purple);box-shadow:0 8px 20px rgba(109,75,216,.15);outline:none}
.game-card .ic{font-size:2.2rem}
.game-card h2{font-size:1.15rem}
.game-card p{color:var(--muted);font-size:.92rem;flex:1}
.stars{font-size:1.2rem;letter-spacing:2px;color:var(--gold)}
.stars .off{color:#d8d0e6}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:20px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;color:var(--muted);font-weight:700;font-size:.92rem;flex-wrap:wrap}
.bar{height:10px;background:#eee6d6;border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));width:0;transition:width .3s}
.q{font-size:1.25rem;font-weight:700;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{background:#faf7ff;border:2px solid #ddd3f5;border-radius:12px;padding:13px 16px;text-align:left;font-size:1.02rem;transition:background .1s,border-color .1s}
.opt:hover:not(:disabled){border-color:var(--purple);background:#f1ebff}
.opt:disabled{cursor:default}
.opt.right{background:var(--green-bg);border-color:var(--green)}
.opt.wrong{background:var(--red-bg);border-color:var(--red)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.98rem}
.feedback.ok{background:var(--green-bg)}
.feedback.no{background:var(--red-bg)}
.btn{background:var(--purple);color:#fff;border:none;border-radius:12px;padding:11px 22px;font-weight:700;margin-top:14px}
.btn:hover:not(:disabled){background:var(--purple-d)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#efe9ff;color:var(--purple)}
.btn.ghost:hover{background:#e3d9ff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{text-align:center;font-weight:800;font-size:1.15rem;padding:16px}
.result{text-align:center;padding:10px 0}
.result .big{font-size:3rem}
.result h2{margin:6px 0}
.result .stars{font-size:2.4rem;margin:8px 0}
/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{background:#faf7ff;border:2px solid #ddd3f5;border-radius:12px;padding:10px 12px;text-align:left;font-size:.95rem}
.tile.term{font-weight:700}
.tile:hover:not(:disabled){border-color:var(--purple)}
.tile.sel{border-color:var(--purple);background:#e9e0ff;box-shadow:0 0 0 3px rgba(109,75,216,.2)}
.tile.done{background:var(--green-bg);border-color:var(--green);opacity:.75;cursor:default}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* timeline */
.tl{display:grid;gap:8px;margin-bottom:14px}
.tl .tile{display:flex;gap:10px;align-items:center}
.tl .num{background:var(--purple);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:800;flex:none;font-size:.9rem}
.yr{margin-left:auto;color:var(--green);font-weight:800;white-space:nowrap;font-size:.85rem}
/* sort */
.sortcard{background:#fff8e1;border:3px dashed var(--gold);border-radius:14px;padding:26px 16px;text-align:center;font-size:1.25rem;font-weight:700;margin-bottom:14px}
.sortbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sortbtns .opt{text-align:center;font-weight:800}
/* cloze */
.cloze{font-size:1.1rem;line-height:2.4;margin-bottom:12px}
.slot{display:inline-block;min-width:110px;border-bottom:3px solid var(--purple);background:#f4efff;border-radius:8px 8px 0 0;padding:0 10px;text-align:center;font-weight:700;margin:0 3px;min-height:34px;vertical-align:middle;line-height:34px}
button.slot{font-size:inherit}
.slot.right{background:var(--green-bg);border-color:var(--green)}
.slot.wrong{background:var(--red-bg);border-color:var(--red)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#f6f1e4;border-radius:12px}
.chip{background:#fff;border:2px solid #ddd3f5;border-radius:999px;padding:6px 16px;font-weight:700}
.chip:hover:not(:disabled){border-color:var(--purple)}
.chip:disabled{opacity:.3;cursor:default}
.confetti{font-size:2rem}
footer{max-width:960px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.85rem;text-align:center}
footer button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.85rem}
@media(max-width:560px){
  .match{gap:8px}.tile{font-size:.88rem;padding:9px}
  .sortbtns{grid-template-columns:1fr}
  header h1{font-size:1.3rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const $ = s => document.querySelector(s);

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function starsHtml(n){ return '<span class="stars" aria-label="'+n+' av 3 stjärnor">'+[1,2,3].map(i=>i<=n?'★':'<span class="off">★</span>').join('')+'</span>'; }
function updateBadges(){
  const total = Object.values(save.stars).reduce((a,b)=>a+b,0);
  $('#totalStars').textContent = '⭐ '+total+' / '+(GAMES.length*3);
  $('#totalPoints').textContent = '🏆 '+save.points+' p';
}
function finish(id, correct, total){
  const pct = total ? correct/total : 0;
  const stars = pct>=0.9 ? 3 : pct>=0.7 ? 2 : pct>=0.5 ? 1 : 0;
  const newBest = stars > (save.stars[id]||0);
  if (newBest) save.stars[id] = stars;
  save.points += correct*10;
  persist(); updateBadges();
  const msg = stars===3 ? 'Fantastiskt!' : stars===2 ? 'Mycket bra!' : stars===1 ? 'Bra jobbat – försök igen för fler stjärnor!' : 'Öva lite till så går det bättre!';
  stage.innerHTML = '<div class="panel result"><div class="big">'+(stars>=2?'🎉':'💪')+'</div><h2>'+msg+'</h2>'+
    starsHtml(stars)+'<p><strong>'+correct+' av '+total+'</strong> rätt · +'+(correct*10)+' poäng'+(newBest&&stars>0?' · ny bästa nivå!':'')+'</p>'+
    '<div class="row" style="justify-content:center"><button class="btn" id="again">Spela igen</button><button class="btn ghost" id="tomenu">Till menyn</button></div></div>';
  $('#again').onclick = () => GAMES.find(g=>g.id===id).start();
  $('#tomenu').onclick = menu;
}
function frame(title, html){
  stage.innerHTML = '<button class="back" id="bk">← Till menyn</button><div class="panel">'+html+'</div>';
  $('#bk').onclick = menu;
}
function topbar(label, i, n){
  return '<div class="topline"><span>'+label+'</span><span>'+Math.min(i+1,n)+' / '+n+'</span></div><div class="bar"><i style="width:'+(i/n*100)+'%"></i></div>';
}

/* ============ SPEL 1: SNABBQUIZ ============ */
function startQuiz(){
  const qs = pick(QUIZ,10); let i=0, score=0;
  function show(){
    const [q,opts,ans,why] = qs[i];
    const order = shuffle(opts.map((o,k)=>[o,k===ans]));
    frame('', topbar('🧠 Snabbquiz',i,qs.length)+'<div class="q">'+q+'</div><div class="opts">'+
      order.map((o,k)=>'<button class="opt" data-k="'+k+'">'+o[0]+'</button>').join('')+'</div><div id="fb" aria-live="polite"></div>');
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, ok=order[k][1];
      stage.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true; if(order[j][1]) x.classList.add('right');});
      if(!ok) b.classList.add('wrong'); else score++;
      $('#fb').innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><strong>'+(ok?'Rätt! 🎉':'Inte riktigt.')+'</strong> '+why+'</div><button class="btn" id="nx">'+(i===qs.length-1?'Se resultat':'Nästa fråga →')+'</button>';
      $('#nx').focus();
      $('#nx').onclick=()=>{ i++; i<qs.length?show():finish('quiz',score,qs.length); };
    });
  }
  show();
}

/* ============ SPEL 2: SANT ELLER FALSKT ============ */
function startTF(){
  const qs = pick(TF,12); let i=0, score=0;
  function show(){
    const [s,ans,why] = qs[i];
    frame('', topbar('✅ Sant eller falskt?',i,qs.length)+'<div class="q">'+s+'</div><div class="tf"><button class="opt" data-v="1">👍 Sant</button><button class="opt" data-v="0">👎 Falskt</button></div><div id="fb" aria-live="polite"></div>');
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok = (b.dataset.v==='1')===ans;
      stage.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if((x.dataset.v==='1')===ans) x.classList.add('right');});
      if(!ok) b.classList.add('wrong'); else score++;
      $('#fb').innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><strong>'+(ok?'Rätt! 🎉':'Fel.')+'</strong> '+why+'</div><button class="btn" id="nx">'+(i===qs.length-1?'Se resultat':'Nästa →')+'</button>';
      $('#nx').focus();
      $('#nx').onclick=()=>{ i++; i<qs.length?show():finish('tf',score,qs.length); };
    });
  }
  show();
}

/* ============ SPEL 3: BEGREPPSPAR ============ */
function startMatch(){
  const rounds=2, perRound=6; let r=0, mistakes=0, matched=0;
  const total = rounds*perRound;
  function round(){
    const set = pick(TERMS,perRound);
    const left = shuffle(set), right = shuffle(set);
    frame('', topbar('🔗 Begreppsparen – koppla ord och förklaring',r,rounds)+
      '<div class="match"><div class="col" id="L">'+left.map(t=>'<button class="tile term" data-w="'+t[0]+'">'+t[0]+'</button>').join('')+'</div>'+
      '<div class="col" id="R">'+right.map(t=>'<button class="tile" data-w="'+t[0]+'">'+t[1]+'</button>').join('')+'</div></div>'+
      '<p class="topline" style="margin-top:14px" id="info">Fel: '+mistakes+'</p>');
    let selL=null, selR=null, left_=perRound;
    function check(){
      if(!selL||!selR) return;
      if(selL.dataset.w===selR.dataset.w){
        [selL,selR].forEach(b=>{b.classList.remove('sel');b.classList.add('done');b.disabled=true;});
        matched++; left_--;
        selL=selR=null;
        if(!left_){ r++; setTimeout(()=> r<rounds?round():finish('match',Math.max(0,total-mistakes),total),500); }
      } else {
        mistakes++; $('#info').textContent='Fel: '+mistakes;
        const a=selL,b=selR; selL=selR=null;
        [a,b].forEach(x=>{x.classList.add('shake');});
        setTimeout(()=>[a,b].forEach(x=>{x.classList.remove('shake','sel');}),380);
      }
    }
    $('#L').onclick=e=>{const b=e.target.closest('.tile'); if(!b||b.disabled) return; if(selL) selL.classList.remove('sel'); selL=b; b.classList.add('sel'); check();};
    $('#R').onclick=e=>{const b=e.target.closest('.tile'); if(!b||b.disabled) return; if(selR) selR.classList.remove('sel'); selR=b; b.classList.add('sel'); check();};
  }
  round();
}

/* ============ SPEL 4: TIDSLINJEN ============ */
function startTimeline(){
  const order = shuffle(TIMELINE.map((e,i)=>i)); let next=0, mistakes=0;
  frame('', '<div class="topline"><span>⏳ Tidslinjen – klicka i rätt ordning, äldst först</span><span id="info">Fel: 0</span></div>'+
    '<div class="tl" id="tl">'+order.map(i=>'<button class="tile" data-i="'+i+'"><span class="num">?</span><span>'+TIMELINE[i][0]+'</span></button>').join('')+'</div><div id="fb" aria-live="polite"></div>');
  $('#tl').onclick=e=>{
    const b=e.target.closest('.tile'); if(!b||b.disabled) return;
    const i=+b.dataset.i;
    if(i===next){
      b.disabled=true; b.classList.add('done');
      b.querySelector('.num').textContent=next+1;
      b.insertAdjacentHTML('beforeend','<span class="yr">'+TIMELINE[i][1]+'</span>');
      next++;
      if(next===TIMELINE.length){
        const total=TIMELINE.length;
        $('#fb').innerHTML='<div class="feedback ok"><strong>Klart! 🎉</strong> Du la alla händelser i rätt ordning.</div><button class="btn" id="nx">Se resultat</button>';
        $('#nx').onclick=()=>finish('timeline',Math.max(0,total-mistakes),total);
      }
    } else {
      mistakes++; $('#info').textContent='Fel: '+mistakes;
      b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),380);
    }
  };
}

/* ============ SPEL 5: SORTERA KYRKORNA ============ */
function startSort(){
  const cards = pick(SORT,12); let i=0, score=0;
  function show(){
    const [txt,cat]=cards[i];
    frame('', topbar('⛪ Vilken kyrka? Sortera påståendet',i,cards.length)+
      '<div class="sortcard">'+txt+'</div><div class="sortbtns">'+
      Object.keys(SORT_CATS).map(k=>'<button class="opt" data-k="'+k+'">'+SORT_CATS[k]+'</button>').join('')+'</div><div id="fb" aria-live="polite"></div>');
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.k===cat;
      stage.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.k===cat) x.classList.add('right');});
      if(!ok) b.classList.add('wrong'); else score++;
      $('#fb').innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><strong>'+(ok?'Rätt! 🎉':'Nej.')+'</strong> Det hör till: '+SORT_CATS[cat]+(txt==='Anglikanska kyrkan'?' (en blandning av protestantiskt och katolskt).':'.')+'</div><button class="btn" id="nx">'+(i===cards.length-1?'Se resultat':'Nästa →')+'</button>';
      $('#nx').focus();
      $('#nx').onclick=()=>{ i++; i<cards.length?show():finish('sort',score,cards.length); };
    });
  }
  show();
}

/* ============ SPEL 6: LUCKTEXT ============ */
function startCloze(){
  const texts = shuffle(CLOZE); let ti=0, correct=0, total=0;
  function show(){
    const c=texts[ti]; const answers=[];
    const html=c.t.replace(/\[([^\]]+)\]/g,(m,a)=>{answers.push(a); return '<button class="slot" data-s="'+(answers.length-1)+'" aria-label="Lucka '+answers.length+'"></button>';});
    const chips=shuffle(answers.concat(c.extra));
    const filled=new Array(answers.length).fill(null);
    frame('', topbar('📝 Lucktext – klicka på ord för att fylla luckorna',ti,texts.length)+
      '<div class="cloze">'+html+'</div><div class="bank" id="bank">'+chips.map((w,k)=>'<button class="chip" data-k="'+k+'">'+w+'</button>').join('')+'</div>'+
      '<div class="row"><button class="btn" id="chk" disabled>Rätta</button></div><div id="fb" aria-live="polite"></div>');
    let checked=false;
    const slots=[...stage.querySelectorAll('.slot')], chipEls=[...stage.querySelectorAll('.chip')];
    let target=null; // vald lucka
    function refresh(){
      slots.forEach((s,k)=>{ s.textContent = filled[k]!==null? chips[filled[k]] : ''; s.style.outline = (target===k && !checked)?'3px solid rgba(109,75,216,.4)':'none'; });
      chipEls.forEach((c,k)=>c.disabled = filled.includes(k) || checked);
      $('#chk').disabled = checked || filled.includes(null);
    }
    slots.forEach((s,k)=>s.onclick=()=>{ if(checked) return; if(filled[k]!==null){ filled[k]=null; } target=k; refresh(); });
    chipEls.forEach((c,k)=>c.onclick=()=>{
      if(checked) return;
      let t = (target!==null && filled[target]===null) ? target : filled.indexOf(null);
      if(t<0) return;
      filled[t]=k; target=null; refresh();
    });
    $('#chk').onclick=()=>{
      checked=true; let ok=0;
      slots.forEach((s,k)=>{ const right=chips[filled[k]]===answers[k]; if(right){ok++; s.classList.add('right');} else {s.classList.add('wrong'); s.textContent=chips[filled[k]]+' → '+answers[k];} });
      correct+=ok; total+=answers.length; refresh();
      $('#fb').innerHTML='<div class="feedback '+(ok===answers.length?'ok':'no')+'"><strong>'+ok+' av '+answers.length+' rätt.</strong> '+(ok===answers.length?'Perfekt! 🎉':'De rödmarkerade luckorna visar rätt svar.')+'</div><button class="btn" id="nx">'+(ti===texts.length-1?'Se resultat':'Nästa text →')+'</button>';
      $('#nx').onclick=()=>{ ti++; ti<texts.length?show():finish('cloze',correct,total); };
    };
    refresh();
  }
  show();
}

/* ============ MENY ============ */
const GAMES = [
 {id:'quiz', icon:'🧠', name:'Snabbquiz', desc:'10 slumpade flervalsfrågor med förklaring efter varje svar.', start:startQuiz},
 {id:'tf', icon:'✅', name:'Sant eller falskt?', desc:'Snabba påståenden – avgör om de stämmer. Perfekt uppvärmning!', start:startTF},
 {id:'match', icon:'🔗', name:'Begreppsparen', desc:'Koppla ihop begrepp med rätt förklaring, två omgångar.', start:startMatch},
 {id:'timeline', icon:'⏳', name:'Tidslinjen', desc:'Lägg händelserna från Jesus till reformationen i rätt ordning.', start:startTimeline},
 {id:'sort', icon:'⛪', name:'Vilken kyrka?', desc:'Är det katolskt, ortodoxt eller protestantiskt? Sortera 12 påståenden.', start:startSort},
 {id:'cloze', icon:'📝', name:'Lucktext', desc:'Fyll i de saknade orden i korta texter om kristendomens historia.', start:startCloze}
];
function menu(){
  stage.innerHTML = '<div class="menu">'+GAMES.map(g=>
    '<button class="game-card" data-id="'+g.id+'"><span class="ic">'+g.icon+'</span><h2>'+g.name+'</h2><p>'+g.desc+'</p>'+starsHtml(save.stars[g.id]||0)+'</button>').join('')+'</div>';
  stage.querySelectorAll('.game-card').forEach(c=>c.onclick=()=>GAMES.find(g=>g.id===c.dataset.id).start());
  updateBadges();
}
$('#resetBtn').onclick=()=>{ if(confirm('Vill du nollställa alla dina stjärnor och poäng?')){ save={stars:{},points:0}; persist(); menu(); } };
menu();
</script>
