<svg viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tidslinje-title tidslinje-desc" width="100%" height="100%">
  <title id="tidslinje-title">Tidslinje för EU:s AI-förordning</title>
  <desc id="tidslinje-desc">Sex viktiga datum: 1 augusti 2024 träder förordningen i kraft, 2 februari 2025 börjar förbjudna AI-metoder och kravet på AI-kompetens gälla, 2 augusti 2025 börjar reglerna för generella AI-modeller gälla, 2 augusti 2026 börjar märkningskrav för AI-genererat innehåll gälla, 2 december 2027 börjar högriskreglerna för fristående system som skolans AI-verktyg gälla, och 2 augusti 2028 börjar högriskreglerna för AI inbyggt i produkter gälla.</desc>

  <line x1="60" y1="130" x2="900" y2="130" stroke="var(--border, #cbd5e1)" stroke-width="3" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <g transform="translate(60,130)">
      <circle r="10" fill="var(--primary, #2563eb)" />
      <text y="-24" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text, #1e293b)">1 aug 2024</text>
      <text y="34" text-anchor="middle" font-size="13" fill="var(--text-muted, #64748b)">
        <tspan x="0" dy="0">Förordningen</tspan>
        <tspan x="0" dy="16">träder i kraft</tspan>
      </text>
    </g>

    <g transform="translate(228,130)">
      <circle r="10" fill="var(--primary, #2563eb)" />
      <text y="-24" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text, #1e293b)">2 feb 2025</text>
      <text y="34" text-anchor="middle" font-size="13" fill="var(--text-muted, #64748b)">
        <tspan x="0" dy="0">Förbud + krav på</tspan>
        <tspan x="0" dy="16">AI-kompetens (art. 4)</tspan>
      </text>
    </g>

    <g transform="translate(396,130)">
      <circle r="10" fill="var(--primary, #2563eb)" />
      <text y="-24" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text, #1e293b)">2 aug 2025</text>
      <text y="34" text-anchor="middle" font-size="13" fill="var(--text-muted, #64748b)">
        <tspan x="0" dy="0">Regler för stora</tspan>
        <tspan x="0" dy="16">AI-modeller (GPAI)</tspan>
      </text>
    </g>

    <g transform="translate(564,130)">
      <circle r="10" fill="var(--accent, #7c3aed)" />
      <text y="-24" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text, #1e293b)">2 aug 2026</text>
      <text y="34" text-anchor="middle" font-size="13" fill="var(--text-muted, #64748b)">
        <tspan x="0" dy="0">Märkning av</tspan>
        <tspan x="0" dy="16">AI-genererat innehåll</tspan>
      </text>
    </g>

    <g transform="translate(732,130)">
      <circle r="10" fill="var(--accent, #7c3aed)" />
      <text y="-24" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text, #1e293b)">2 dec 2027</text>
      <text y="34" text-anchor="middle" font-size="13" fill="var(--text-muted, #64748b)">
        <tspan x="0" dy="0">Högriskregler för</tspan>
        <tspan x="0" dy="16">t.ex. AI-verktyg i skolan</tspan>
      </text>
    </g>

    <g transform="translate(900,130)">
      <circle r="10" fill="var(--accent, #7c3aed)" />
      <text y="-24" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text, #1e293b)">2 aug 2028</text>
      <text y="34" text-anchor="middle" font-size="13" fill="var(--text-muted, #64748b)">
        <tspan x="0" dy="0">Högriskregler för AI</tspan>
        <tspan x="0" dy="16">inbyggt i produkter</tspan>
      </text>
    </g>
  </g>
</svg>
