<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="riskpyramid-title riskpyramid-desc" width="100%" height="100%">
  <title id="riskpyramid-title">Riskpyramiden i EU:s AI-förordning</title>
  <desc id="riskpyramid-desc">Fyra nivåer, från smalast överst till bredast underst: Oacceptabel risk som är helt förbjuden, Hög risk som är tillåten men med stränga krav, Begränsad risk som kräver att man informerar om att AI används, och Minimal risk som är den stora massan av AI-system utan särskilda lagkrav.</desc>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <polygon points="270,20 370,20 420,100 220,100" fill="var(--risk-unacceptable, #dc2626)" />
    <text x="320" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Oacceptabel</text>
    <text x="320" y="76" text-anchor="middle" font-size="12" fill="#ffffff">risk — förbjudet</text>

    <polygon points="220,110 420,110 470,190 170,190" fill="var(--risk-high, #ea580c)" />
    <text x="320" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Hög risk</text>
    <text x="320" y="166" text-anchor="middle" font-size="12" fill="#ffffff">tillåtet, stränga krav</text>

    <polygon points="170,200 470,200 520,280 120,280" fill="var(--risk-limited, #ca8a04)" />
    <text x="320" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Begränsad risk</text>
    <text x="320" y="256" text-anchor="middle" font-size="12" fill="#ffffff">kräver information om AI</text>

    <polygon points="120,290 520,290 570,370 70,370" fill="var(--risk-minimal, #16a34a)" />
    <text x="320" y="325" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Minimal risk</text>
    <text x="320" y="346" text-anchor="middle" font-size="12" fill="#ffffff">inga särskilda krav</text>
  </g>
</svg>
